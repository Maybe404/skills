    baseline_reset_reason: 首次合并的拆规则阶段读了 scripts/observe.py 和 scripts/improve.py，ALL-M-009、ALL-M-010、ALL-M-015、ALL-M-016 的证据落在 observe.py，ALL-M-011、ALL-M-012、ALL-M-013 的证据落在 improve.py，而 paths 里只有 SKILL.md，这两个文件改动时监控不会发现，七条规则的证据基础会静默过期。补进 paths 使追踪范围与已有证据一致。两个文件是首次纳入追踪，没有旧基线可比，last_processed_commit 和 last_accepted_commit 保持 null；snapshot_policy 仍为 metadata-only，仓库内不保存这两个文件的内容。
