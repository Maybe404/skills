  reason: 可达；与 blader/humanizer 核实为各自独立引用同一个 Wikipedia 页面改编而成，非 fork/衍生关系，lineage 由 humanizer 改记为 aboudjem-humanizer，作为该谱系代表入围进入拆规则。
  notes: '中英双语模式表。仓库内 cli/ 和 tools/ 不追踪、不执行。谱系核实结论：SKILL.md 和 references/patterns.md 明确写 P1-P30 核心模式表''derived
    mostly from Wikipedia: Signs of AI writing''，且 P11/P31 直接使用该页面的术语''Elegant Variation''；blader/humanizer
    的 SKILL.md 末尾''Source''一节同样写''This skill is based on Wikipedia: Signs of AI writing''。两者与 blader 的触发词表（delve、tapestry、testament、nestled、in
    the heart of、serves as、stands as 等）高度重合，是因为都摘自这同一篇 Wikipedia 页面，而非互相转抄：GitHub 未记录 fork 关系（Aboudjem/humanizer-skill
    的 fork 字段为 false，无 parent），SKILL.md 和 references 里也没有提到 blader。Aboudjem 仓库创建于 2026-03-06，晚于 blader
    的 2026-01-18，但两者的整体结构（blader 是扁平的 35 条模式清单；Aboudjem 是 Step 1-5 的流程加 55 条分层模式表、5 种 voice、CLI 参数、评分和迭代机制）差异很大，P31-P55
    的''emerging''和''craft/forensic''模式（如 P44 False Agency、P51 Reasoning-Chain Artifacts、P52 Unicode Obfuscation）在
    blader 里完全没有对应，patterns.md 明确写这些是''described independently of any other project''s pattern names or
    text''。结论：独立作品，不是 blader 的 fork、改编或扩展。'
