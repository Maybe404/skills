  rationale: 来源限定简体中文，本仓库改为中英文都适用——判据（原文有的限定语在改写稿里还在不在）不依赖语言，英文的 might、I think、not sure 同样适用，这是本条记 adopted-with-modification 的原因。independent_sources 为 1，但按 criteria.md 第 3 条五项逐项成立：本 skill 用到、现象真实、与已采用规则不矛盾、中英文都适配、evals 第二类样本直接覆盖。与 EN-P-030（与语气矛盾的保留语）冲突：EN-P-030 只能删与句子实际语气自相矛盾的保留语，不得删原文真实表达的不确定，两条的边界写在 conflicts.md。
