    note: 本条需要读上下文才能判定，按 ALL-M-023 在报告里与出处相关的命中分开列。
  rationale: 上游在三个地方写了同一件事，本条把三处合成一条。一是 detect 模式的输出格式："a wordiness fix is a writing suggestion, not evidence about who wrote the text"，要求两类在版面上分开。二是词表第一档内部再分 1A（AI 频率标记）和 1B（清晰度编辑）两带，1B 按更低的权重计并排除在词汇密度信号之外，他给的依据是在 257 段核实为 2023 年之前的真人文字上，1B 条目（in order to、utilize、commence、ascertain、endeavor）以可观的比例命中普通的专业和正式写作——这个样本量和结论是上游给的依据，本仓库没有核实过，不作为已验证事实转述。三是把五项需要读上下文才能判定的清晰度检查整体标成「判断型」，要求逐条核对各自的通过条件，并写明它们不构成出处证据。 本仓库采纳。它填的缺口是：ALL-PROT-012 禁止判断一段文字是不是 AI 写的，ALL-PROC-024 规定审稿结论用四种判定、证据最多列两条——两条都管结论，不管呈现方式。而一份把「这句太啰嗦」和「这里有一处工具引用标记」并列成一张平表的报告，读者会把前者也读成 AI 的证据，那等于绕过了 ALL-PROT-012。上游把它写成输出格式而不是判断规则，理由是输出格式可以被检查，判断规则不能——这个理由本仓库同意。 可判定：报告里两类命中有没有分块、有没有一句话说明第二类不作出处证据。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。
