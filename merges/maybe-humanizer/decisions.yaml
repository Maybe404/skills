  rationale: 上游给了问题命名 "Hedging disguised as reassurance"，判据写在命名里：形式是让步（看起来在承认局限），实际是保留语（没有承认任何具体的局限），让作者显得诚实而不必付出诚实的代价——依据是 disguised 这个词。 现有的 EN-P-030 判据是"保留语与句子的实际语气自相矛盾"，管不到这一种：Not always. Not perfectly. 与前一句的语气并不矛盾，它只是不指向任何东西。 改的是门槛：上游不带频率口径（四份文件里唯一的数量判据只有"连续三句同长"和"低于 35/50"两条），本仓库按 ALL-M-002 的口径补一条——单处否定对偶可能是作者真的在收一句话，反复出现才是表演。按 criteria.md 第 2 条（能圈出那两句）和第 3 条采用。
