    note: 边界：EN-S-001 的 blunt 一档要求几乎不用保留语，遇到原文真实表达的不确定时让位给 ALL-PROT-004；「几乎不用保留语」在本仓库读作「不堆叠保留语」（EN-P-029），不读作「删掉全部保留语」。
  rationale: 五条证据但 independent_sources 为 1，且每一档都在要求一种具体腔调（人称、缩写、段落长度、语气），正是 criteria.md 第 4 条针对的强风格意见：换一个作者、换一个体裁就不成立。更重要的是它与 ALL-PROT-017（保留作者声口）方向相反——把输入文本改成五档里的某一档，就是换掉作者的声口，按 criteria.md 第 1 条 protection 优先。记 reference-only：用户明确要求“改成某种语气”时可以按这份档位表操作，不作默认。 【英文批二补记】本条从 reference-only 改判为 adopted-with-modification（默认不启用的可选项），decision_revision 从 1 加到 2，理由如下。 首次合并时按 criteria.md 第 4 条记 reference-only：单一来源、category 为 style-opinion、要求一种具体腔调（句长、语气词、人称、标点偏好），判据是「换一个作者、换一个体裁还成不成立」。本批拿到 upstream-conorbronsdon-avoid-ai-writing 这个第二个独立谱系给出的同一套五档（casual / professional / technical / warm / blunt），改判的依据不是多了一个来源——criteria.md 第 3 条写明票数不决定采用——而是这一版带了原来那一版没有的两样东西。 一是每一档给的是一组可核对的目标而不是一种感觉，上游自己就是这么说的（"a set of concrete targets, not a vibe"）：casual 的平均句长 14 词以内、warm 的 15 到 20 词、professional 的每段一个具体主张、technical 的行话首次出现给定义。这些是可以逐条核的，而本条原来的五档写的是「干燥的机智」「承认困难」这类需要判断的说法。 二是每一档都内嵌了保护条款，上游还在五档定义之前先写了一句总的边界："Every target below is bounded by the Never-inject guardrails"——声口档只能把原文已经有的东西带出来，绝不制造原文没有的东西。本条原来的 casual 一档写的是「一律用缩写、第一人称、口语过渡词」，那个「第一人称」是无条件的，撞 ALL-PROT-018；上游的 casual 写的是「原文有第一人称和具体细节的地方保住，绝不添一处它没有的」。这一处差别正是本条当初进不了默认规则的那一点。 改写后的口径有三处修改。一、默认不启用：用户没有点名一种声口时按 ALL-PROC-031 从输入语域推断，不套档位；上游同样把声口设成可选（"don't force a persona onto text that already has one"）。二、blunt 一档的「几乎不用保留语」在本仓库读作「不堆叠保留语」（EN-P-029），不读作「删掉全部保留语」——原文真实表达的不确定按 ALL-PROT-004 不动，这一条已写进 relations 的 excepts。三、五档的目标合成一句硬边界写进 rule_summary，不留在各档的说明里，避免执行时只读到目标读不到边界。 上游给的搭配默认值（casual 配随意语域、professional 配社交与商务邮件、technical 配文档与技术长文）本仓库不写死，理由是 ALL-PROC-058 已经规定四条轴分别判定、判据层两条方向不一致时取更严的一边，写死默认搭配会把那条裁决规则架空。 上游还给了一条本条现在没有的替代路径：作者提供了自己写的样本时按样本校准，不套一个有名字的档位——那一条本批并进了 ALL-PROC-037。
  history:
  - decision: reference-only
    at: '2026-09-06T12:00:00Z'
    reason: 首次合并
