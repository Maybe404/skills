    anchor: '### ALL-M-022 命中按类型排处理顺序，不给整篇打分'
  category: measurement
  language: both
  rule_summary: 命中按类型排处理顺序，不按条数打分：第一档是生成过程的残留和没有出处的断言（工具引用标记、未填写的占位符、知识截止免责声明、模糊归因、把猜测写成陈述），第二档是一眼能认出的模式（词表第一档命中、套路化开场收尾、对称骨架、加粗与列表滥用），第三档是风格打磨（过渡词、标点偏好、句长节奏）。时间不够或文本很长时只处理前两档，并写明第三档本轮没查。
  decision: adopted-with-modification
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T18:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
