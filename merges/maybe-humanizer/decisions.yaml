    note: ALL-PROT-020 说删连接词时保留真实的逻辑关系，本条给出删之前必须过的那道检查，两条一起用才不会删出语法上成立、语义上断掉的句子。
  rationale: 删短语看起来是最小的改动，但中文的短语常常承担指代和限定，删掉之后句子在语法上还成立、在语义上已经断了。上游给的三个判据（完整、可读、无悬空指代）都可以逐句执行，而现有规则只说了要保留逻辑关系，没有给出这道检查。可判定：把删除后的句子单独读一遍，问它指的是什么；答不上来就是悬空指代。
