    anchor: '##### Tier 1A — AI frequency markers / **Abstract-noun boundary:**'
  relations:
  - type: pairs-with
    rule_id: ALL-PROC-039
    note: ALL-PROC-039 管词表里没有的说法要不要处理，本条管词表里已有的一条在什么形式条件下才算命中；两条方向相反、各管一半。
  rationale: 上游把这条的取舍写明了——"This deliberately misses some metaphors to avoid flagging ordinary writing"：他选择了精确率而不是召回率，并把这个选择和它的代价一起写出来。他要防的是一个词表条目在实现上变成逐字匹配之后的误伤面：同一串字母在两种写法下是两个不同的东西，而作表语的 load-bearing 是完全正常的英语。 本仓库采纳，理由不只是这个词。这条是本批里那组「把误伤控制写成可执行条件」最完整的一例：它给的不是「注意别误伤」，是一个封闭的名词清单加一个位置条件加一份放过清单，三样都可以逐条核。现有的 ALL-PROC-039 说词表列的是模式的代表项、不是完整枚举，方向与本条相反（本条把一条词表条目的适用范围收窄到一个封闭清单）——两条不冲突，因为 ALL-PROC-039 管的是「词表里没有的说法要不要处理」，本条管的是「词表里有的这一条在什么形式条件下才算命中」。 本仓库的英文词表里目前没有 load-bearing 这一条，因此本条落地时要连同词条一起写进 patterns-en.md；这一点已记进第 10 节的补词表清单。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。 另按第 2 条：两个条件（带连字符、紧接八个抽象名词之一）都是纯形式的，能逐句圈出。
