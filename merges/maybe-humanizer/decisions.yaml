- id: EN-P-065
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/conflicts.md
    anchor: '### EN-P-065 无条件删保留语词表'
  category: pattern
  language: en
  rule_summary: 删掉保留语 perhaps、could potentially、it's important to note that、to be clear，把要说的直接说出来（上游给的是一张无条件删除的词表，不带任何例外）。
  decision: rejected
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T18:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-conorbronsdon-avoid-ai-writing
    path: references/patterns.md
    commit: 801c2360f360e38d4316a271b953138e5e166d54
    anchor: '### Sentence structure / - **Hedging**:'
  relations:
  - type: conflicts-with
    rule_id: ALL-PROT-004
    note: ALL-PROT-004 要求原文表达的不确定必须保留，本条要求无条件删掉 perhaps、could potentially；取 ALL-PROT-004。
  rationale: 上游的修法是 "Make the point directly."，他针对的现象成立：多轮编辑会一层层堆保留语，直到句子什么都没主张，而这四条是最常见的四种堆法。 记 rejected，与 ALL-PROT-004 双向记 conflicts-with。分歧落在这张表里混了两类不同的东西。it's important to note that 和 to be clear 是套话——它们不改变命题的真值，删掉之后句子说的还是同一件事，本仓库的 EN-P-004 已经收了前者。perhaps 和 could potentially 是真保留语——它们限定的是命题成立的把握，把 "the cache could potentially miss" 删成 "the cache misses"，一个有条件的说法变成了一个确定的说法，撞 ALL-PROT-004（不得把原文表达的不确定说成确定）和 ALL-PROT-023（情态与强度两项必须逐项找得回来）。上游把两类放进同一张无条件删除的表，本仓库不能整表照收。 值得说明的是上游自己在别处写对了这一层：他的 Hedge-stacked predictions 一节写的是 "Either word alone is acceptable; the stack is the tell."——单独用哪一个都正当，叠起来才是痕迹。那一条本批已经并进 EN-P-029 作为证据。同一份文件里的两条规则在同一批词上给了两种口径，本仓库取他写得更细的那一条。 他那个场景成立时怎么开启：EN-P-029 已经允许把一串保留语压成一个；EN-P-030 已经允许删掉与句子实际语气自相矛盾的保留语；EN-P-004 已经收了 it's important to note。要连原文真实的限定一起删，本仓库没有留这个开关——那不是风格问题。 与英文批一的结论一致：hardikpandya 的 EN-S-011（删掉全部保留语含 most）按同一条理由记 rejected。 裁决依据：criteria.md 第 1 条（事实保护优先于 style-opinion）与第 8 条（冲突两条都留痕，双向记 conflicts-with 并在两条的 rationale 里互相点名）。
  history:
  - decision: rejected
    at: '2026-09-07T18:00:00Z'
    reason: 英文批二合并
- id: EN-P-066
  local:
