  rationale: 上游把这一条写成 Core Rule 5（把读者放进现场）的语法层落实——他认为 AI 文本读起来悬空，根源是句子里没有人；要求每句都有人作主语，是把这个直觉写成一条机器能执行的判据。观察成立。 本仓库不采纳。它与 ALL-PROT-033 正面相反："调度器会在超时后重新入队"改成"我们会在超时后重新把它放回队列"不是风格改进，是事实错误——读者会以为这是人工操作。技术文档和百科里大量正确的句子没有人作主语，把它们全部改掉需要给每一句找一个原文没有指认的施事者，那又撞 ALL-PROT-001。 上游自己的两份文件在这一点上也不一致：SKILL.md 写的是 human subject，references/structures.md 的 `## Passive Voice` 一节写的是 "Every sentence needs a subject doing something."，少了 human。按后一种口径本条与 ALL-P-004 完全重合，不构成新规则；本仓库按 SKILL.md 的强口径裁决，因为那是上游正文里写死的版本。 他那个场景成立时怎么开启：散文里"悬空"的那一类由 ALL-P-004 管——它已经要求指名动作的执行者、不让抽象事物做只有人能做的动作。本仓库没有留"每句必须有人作主语"这个开关。按 criteria.md 第 1 条与第 8 条。
