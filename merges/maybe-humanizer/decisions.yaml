- id: EN-P-026
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/patterns-en.md
    anchor: '### EN-P-026 英文破折号'
  category: pattern
  language: en
  rule_summary: 英文破折号（U+2014）按全文词数分界：200 词以下算短文，一处都不用；200 词以上算长文，确实比逗号、句号或括号更合适时至多留一到两处。不论篇幅，同一段里出现两处以上算成串，成串出现的和纯装饰性的一律去掉。
  decision: adopted-with-modification
  decision_origin: human-approved
  decision_revision: 2
  decided_at: '2026-09-06T12:00:00Z'
  evidence_count: 2
  independent_sources: 2
  sources:
  - type: upstream
    source_id: upstream-petergyang-no-ai-slop
    path: skills/no-ai-slop/SKILL.md
    commit: 000650b156983f5159695b441477f4e63b25dc85
    anchor: '## Patterns to cut / Em dashes.'
  - type: upstream
    source_id: upstream-aboudjem-humanizer-skill
    path: skills/humanizer/SKILL.md
    commit: 275af9489079d0c4a95d47d62a311a5cb0bd85ba
    anchor: '### LANGUAGE & STYLE PATTERNS / P13: Em Dash Ban'
  relations:
  - type: excepts
    rule_id: ZH-P-007
    note: 英文侧的破折号口径，中文不适用，中文走 ZH-P-007。
  - type: conflicts-with
    rule_id: EN-S-004
    note: EN-S-004 是禁令加作者样本例外，本条是按篇幅分界的密度上限；取本条，样本例外单独立成 ALL-PROC-049。
  - type: conflicts-with
    rule_id: EN-S-009
    note: EN-S-009 是无条件禁令、不设任何频率口径；取本条。
  - type: pairs-with
    rule_id: EN-PROC-001
    note: 本条定密度口径，EN-PROC-001 定交付前的查法和时机。
  rationale: 两个独立来源给出两种口径，本仓库采用较宽的一种，因此记 adopted-with-modification。Aboudjem 的“零容忍、一个都不用”被否决：破折号是英文的正常标点，零容忍会改掉真人原文里正当的用法，与 ALL-PROT-017 和 ALL-M-002（孤立的破折号不算证据）都冲突；no-ai-slop 的分级口径（短文零个、长文一到两个、去掉成串）同样可判定，且不误伤。中文一侧走 ZH-P-007，判据不同，不受本条约束。这组冲突写进 conflicts.md。试验后修复补上了缺失的分界：上游两条证据都只说“短文”“长文”，没给词数，判据因此无法执行；本仓库定 200 词为界，写进 rule_summary 和 patterns-en.md，evals 样本 4（44 词）的判据同步按短文口径重写。分界之外的口径不变，因此 decision 仍是 adopted-with-modification。 【英文批一补记】本批比对了三方破折号口径，本条的按篇幅分界口径不变，decision 与 decision_revision 均不动。三方是：blader §14（禁令加作者写作样本例外，记 EN-S-004，rejected）、hardikpandya/stop-slop（无条件禁，SKILL.md 与 references/structures.md 三处陈述都不带频率口径，记 EN-S-009，rejected）、以及本条现有的按篇幅分界。不把前两方并进本条的理由有三条。一、两方都没有给出可以与本条比较的密度口径——stop-slop 四份文件里一条频率判据都没有，blader 给的是禁令加例外，都不是「每多少词几处」这个量纲，并进来只会把本条的阈值换成零。二、blader 真正补上的两样东西不是密度口径：作者写作样本的优先级（立成 ALL-PROC-049，与本条记 excepts）和交付前的破折号字符搜索（立成 EN-PROC-001，与本条记 pairs-with）；这两样无论本条的阈值最后定在哪里都成立，所以单独立条比并进来更稳。三、第四方 upstream-conorbronsdon-avoid-ai-writing 的每千词一处上限在下一批，那是唯一一个与本条同量纲、可以直接比较的口径。留给下一批的接口是一个具体问题：每千词一处与「200 词以下零处、200 词以上一到两处」折算之后差多少，两者在 200 到 1000 词这一段的结论差在哪里，以及 blader 的样本例外（ALL-PROC-049）与那个频率上限是不是同一层机制。另核对了 Wikipedia:Signs of AI writing 的 `Overuse of em dashes` 一节，其口径是频率而不是禁令，与本条方向一致；那一节还附了一条 2026 年 7 月的研究——当代模型里只有 Claude 用得比专业写作者多，ChatGPT 用得更少。
  history:
  - decision: adopted-with-modification
    at: '2026-09-06T12:00:00Z'
    reason: 首次合并
  - decision: adopted-with-modification
    at: '2026-09-06T14:00:00Z'
    reason: 补上短文与长文的词数分界（200 词），decision 不变
