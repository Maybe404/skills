  rationale: 这七项是上游对「条件关系」的完整定义，它在改写前的账本、Pass 1 的回读检查和 FAQ 子场景三处各出现一次，说明它是这份上游的核心检查项。现有 ALL-PROT-020 只笼统写了「真实存在的逻辑关系要保留」，没有说要核对哪些东西，交付自查时没法逐项打勾。七项里有两项是本仓库完全没有点名过的：方向（提升被弱化成「涉及」）和效果类型（效率被扩写成成本，两者不等价）。上游同时点了两个方向的错——弱化常发生在「避免夸大」的动机下，扩写常发生在「写得更具体」的动机下，两种都改变了原文实际声称的东西。可判定：逐项列出原文的七类取值，在改写稿里找回来。 【英文批一补记】hardikpandya/stop-slop 有一条要求把 "X that isn't Y" 改写成 "X is broken"，即把「没有在重试」换成更强也更宽的「坏了」；已单列为 EN-P-054 并记 rejected，双向记 conflicts-with，依据是本条「强度」这一项不得放宽。
  history:
  - decision: adopted
    at: '2026-09-06T22:00:00Z'
    reason: 中文批合并
- id: ALL-PROT-024
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/protection.md
    anchor: '### ALL-PROT-024 步骤顺序与警告位置'
  category: protection
  language: both
  rule_summary: 重排步骤或把结论前置时，原本在操作前的执行条件和警告不得挪到操作后；真实的事后检查和失败分支也不得改成前置步骤。
  decision: adopted
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-06T22:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-mrgediao-shuorenhua
    path: SKILL.md
    commit: d2d0ce27da295581c3cf87a30ab65deb7d0ddfb8
    anchor: '### Scene Packs'
  relations:
  - type: pairs-with
    rule_id: ZH-P-009
    note: ZH-P-009 管句内位置：限定条件要出现在被它限定的内容之前。本条管步骤之间的顺序：警告要出现在它警告的那步操作之前。两条的判定对象是不同层级的位置关系。
  rationale: 上游把这条挂在 FAQ 子场景下，但它的适用面比 FAQ 宽：任何按顺序执行的文本都成立。它针对的现象很具体——「结论先行」这条写作建议被机械执行，把顺序敏感的内容也重排了，读者照着新顺序执行就会踩坑（「先执行迁移。注意：执行前需要先停写入，否则会丢数据。」）。条件和警告的位置本身就是信息，这是它归 protection 而不是 pattern 的原因。ZH-P-009 已经管住句内的限定位置，管不到步骤之间。可判定：找出每条警告和它警告的那步操作，警告在后即违反。
  history:
  - decision: adopted
    at: '2026-09-06T22:00:00Z'
    reason: 中文批合并
- id: ALL-PROT-025
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/protection.md
    anchor: '### ALL-PROT-025 按子句判断，不整句一刀切'
  category: protection
  language: both
  rule_summary: 清理套话、姿态层和空话时按子句判断，不按整句或整行一刀切：删掉某个子句如果会改变命题的真值、适用范围或成立条件，这个子句就是保真对象，不随周围的套话一起删。
  decision: adopted
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-06T22:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-mrgediao-shuorenhua
    path: SKILL.md
    commit: d2d0ce27da295581c3cf87a30ab65deb7d0ddfb8
    anchor: '- 清理姿态层时按子句和事实要素判断'
  relations:
  - type: pairs-with
    rule_id: ALL-PROT-020
    note: ALL-PROT-020 说删修饰时要保留真实的逻辑关系，本条给出执行它的操作粒度：判断落在子句一级，不落在整句一级。
  rationale: 这是清理套话的安全阀：套话和实质内容常常长在同一句里，整句删掉最省事也最危险。上游给的判据（删掉会不会改变真值、适用范围、成立条件）可以逐句执行，而现有 ALL-PROT-020 和 ALL-P-010 只说了「不得靠删信息把句子变短」，没有说判断的粒度是什么。举一个上游的例子：「这个做法在单机上没问题（前提是并发不超过十）」整句读着像套话，但括号里的子句承载成立条件。可判定：把候选删除的那一段单独拿出来，问删掉之后这句话的适用范围变不变。
  history:
  - decision: adopted
    at: '2026-09-06T22:00:00Z'
    reason: 中文批合并
- id: ALL-PROT-026
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/protection.md
    anchor: '### ALL-PROT-026 改注释只删姿态词'
  category: protection
  language: both
  rule_summary: 用户明确要求处理代码注释、docstring 或 commit message 时，只删掉姿态词和多余的语气词，保留其中的真实运行行为、适用条件和边界说明（「否则并发写会丢数据」「实测 8 线程以上必现」一类内容不得删）。用户没有明确要求时，代码块按 ALL-PROC-016 整体跳过。
  decision: adopted-with-modification
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-06T22:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-mrgediao-shuorenhua
    path: SKILL.md
    commit: d2d0ce27da295581c3cf87a30ab65deb7d0ddfb8
    anchor: '- `code-context` 里的真实运行行为'
  relations:
  - type: excepts
    rule_id: ALL-PROC-016
    note: ALL-PROC-016 的默认是把代码块整体标出跳过；本条是它的一个窄例外，只在用户点名要处理注释时生效。
  - type: excepts
    rule_id: ALL-PROC-017
    note: ALL-PROC-017 遇到源代码文件停手；本条不改变这一点，只处理散文改写请求里夹带的注释和提交信息。
  rationale: 上游为代码注释单独开了一个场景，理由成立：注释里的姿态词确实该删，但注释同时是唯一记录「为什么这么写」的地方，删多了信息永久丢失。它把三类内容（运行行为、适用条件、边界说明）列成受保护片段，等于把注释当技术文档而不是散文处理。本仓库现有的做法是整体跳过（ALL-PROC-016）和遇到源码停手（ALL-PROC-017），两者都成立，但都回答不了「用户就是要我清理一遍 commit message」这个请求。修改点：本仓库把上游的默认改成需要用户明确要求才生效，理由是 ALL-PROC-016 的跳过是一条已经 adopted 的默认规则，一条例外不该反过来把默认改掉。
  history:
  - decision: adopted-with-modification
    at: '2026-09-06T22:00:00Z'
    reason: 中文批合并
- id: ALL-PROT-027
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/protection.md
    anchor: '### ALL-PROT-027 实体类型不得互换'
  category: protection
  language: both
  rule_summary: 原文说的是方案、目标、想法、产品还是工具，改写后必须是同一类：不得把「方案」写成「工具」或「产品」，不得把描述潜力的表述（「这套方案有可能支撑更大的规模」）写成已实现的构建关系（「这个产品基于该架构构建」）。
  decision: adopted
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-06T22:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-mrgediao-shuorenhua
    path: SKILL.md
    commit: d2d0ce27da295581c3cf87a30ab65deb7d0ddfb8
    anchor: '- 抽象信息、实体类型和关系不能擅自具体化'
  rationale: 实体类型的漂移是一种很隐蔽的失真：方案、工具、产品在中文里都可以指「那个东西」，但它们对读者承诺的完成度完全不同——方案是想法，产品是已经存在的东西。上游把它排在这一长段保真规则的第一条，说明它见过后果。现有 ALL-PROT-001 管的是新增原文没有的事实，本条管的是原文已有的实体被换了类型，判定对象不同：句子里的每个名词在原文里都能找到对应，但对应错了。可判定：把原文和改写稿里指代同一个东西的名词列出来，类型不同即违反。
  history:
  - decision: adopted
    at: '2026-09-06T22:00:00Z'
    reason: 中文批合并
