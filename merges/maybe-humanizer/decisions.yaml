  rationale: independent_sources 为 1，采用。可判定：一个从句里出现两个以上表示不确定的词即命中。受 ALL-PROT-004 约束：删到只剩一层，不得删成确定。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条两条证据。一是情态词与保留副词叠用（could potentially create、may eventually unlock、might ultimately transform），判据写得比本条更利落："Either word alone is acceptable; the stack is the tell."——单独用哪一个都正当，叠起来才是痕迹；修法是二选一，想说 could create 就写 could create，想说 potentially creates 就写 potentially creates。理由是每一层保留语抵消掉下一层，留下一个什么都没主张、却听着谨慎周到的句子。二是括号里的保留式插注（(and, increasingly, Z)、(or, more precisely, Y)、(and perhaps more importantly, W)），判据是这处插注让文字听着周全实则不作任何承诺，修法二选一：要紧就给它一整句，不要紧就删掉。 第二条的形式本条现在没有——括号插注不是「多层保留语」的形状，但做的是同一件事。记进第 10 节。 值得记下的一处：同一份上游文件的另一节给了一张无条件删除保留语的词表（含 perhaps、could potentially），与这一条的口径正好相反；本批把那一张表记 rejected（EN-P-065），取他写得更细的这一条。同一份来源在同一批词上给了两种强度，裁决按 criteria.md 第 1 条。
