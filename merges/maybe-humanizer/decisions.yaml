  rationale: 上游把它写成 `| Every paragraph ends punchily | Vary endings |`，判据里的 Every 是关键：不是"有一段这样"，是"每段都这样"。它管的是段落级而不是句子级——节拍器式的规律性会在段落收尾这个读者印象最深的位置上重复出现。 现有规则里 ALL-P-001 管的是段落长度和开头句式，EN-P-024 管的是收尾句的内容空不空洞，都不覆盖"每段都用同一种收尾形状"。上一批已按同一条判据立了中文侧的 ZH-P-013（连续三段以上用同一种收尾形状即命中），本条是它的英文对应。两条分立而不是合成一条 both，是因为本仓库的 references 中英分表（SKILL.md 步骤 4），正反例不能互译。阈值沿用 ZH-P-013 的"连续三段以上"——上游只写了 Every，没有给可数的阈值，本仓库不引入一个没有依据的新数字。按 criteria.md 第 2 条（数段落收尾形状）和第 3 条采用。
