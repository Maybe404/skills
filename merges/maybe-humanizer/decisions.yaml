  rationale: 两个独立来源。“不得改写成更好的隐喻”是这条最容易被忽略的一半，来源写得很明确，本仓库照收——把隐喻换一个更精致的版本，是本 skill 最常见的失败方式。可判定：这句话删掉之后，读者少知道了什么事实。 【英文批一补记】hardikpandya/stop-slop 的 Core Rule 8（Cut quotables：听起来像可以摘出来当引言的句子要重写掉）本批作为证据并进本条。上游自己的判据是 "If it sounds like a pull-quote"，按 criteria.md 第 2 条这句话圈不出具体的词或结构，不可判定；本仓库不采用它的判据，仍用本条现有的形式判据（X is the new Y、the currency of、not a X but a Y、X is where Y meets Z 这类格言模板）。它给的反例 "Symmetry is the language of trust." 命中的正是本条的 the currency of 那一类骨架，所以这一条记的是追加证据而不是新规则。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条一条证据，判据比本条的词表宽一格：靠一个填空式的形状把普通论断包装成像是可以摘抄的句子（X is the language of Y、X is the currency of Z、the architecture of trust、X becomes a trap、X is not a tool but a mirror），命中的依据是「形状在替证据做说服」。修法是把这个形状换成它想指的那个具体主张（Symmetry is the language of trust → symmetric layouts feel more predictable to users）。例外：引语和已经成为常用语的固定说法（time is money）保留。 两处与本条的差别：本条只管收尾位置，上游不限位置；本条没有引语与固定说法的例外。两项记进第 10 节。上游自述这一条改编自 blader/humanizer P32，与 blader 的对应单元不构成两个独立观察。 上游把它与两条相邻规则的分工写得很清楚：意义充值是把一件事的重要性吹大，权威腔是宣告深度，本条是从一个具体观察里造出一条普遍规律。
