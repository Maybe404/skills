    anchor: '### LANGUAGE & STYLE PATTERNS / P13: Em Dash Ban'
  relations:
  - type: excepts
    rule_id: ZH-P-007
    note: 英文侧的破折号口径，中文不适用，中文走 ZH-P-007。
  rationale: 两个独立来源给出两种口径，本仓库采用较宽的一种，因此记 adopted-with-modification。Aboudjem 的“零容忍、一个都不用”被否决：破折号是英文的正常标点，零容忍会改掉真人原文里正当的用法，与 ALL-PROT-017 和 ALL-M-002（孤立的破折号不算证据）都冲突；no-ai-slop 的分级口径（短文零个、长文一到两个、去掉成串）同样可判定，且不误伤。中文一侧走 ZH-P-007，判据不同，不受本条约束。这组冲突写进 conflicts.md。试验后修复补上了缺失的分界：上游两条证据都只说“短文”“长文”，没给词数，判据因此无法执行；本仓库定 200 词为界，写进 rule_summary 和 patterns-en.md，evals 样本 4（44 词）的判据同步按短文口径重写。分界之外的口径不变，因此 decision 仍是 adopted-with-modification。
  history:
  - decision: adopted-with-modification
    at: '2026-09-06T12:00:00Z'
    reason: 首次合并
  - decision: adopted-with-modification
    at: '2026-09-06T14:00:00Z'
    reason: 补上短文与长文的词数分界（200 词），decision 不变
