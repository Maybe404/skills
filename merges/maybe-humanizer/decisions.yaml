  rationale: 上游针对的现象是真实的：模型习惯性地两边各说一句以示平衡，结果整篇没有立场，读起来像新闻稿。这一点本仓库已经用 ALL-PROC-018 承认了（点名拒绝各打五十大板的两边论调）。分歧在处理动作：上游要求补出一个作者反应，本仓库只允许删掉那种假平衡，不允许补。理由是改写工具没有作者的立场可写——补出来的反应是模型的反应，署在作者名下，读者无从分辨。上游那个场景（原文里作者本来就有态度，被前一轮改写洗掉了）在本仓库由 ALL-PROT-017 覆盖：作者的犹疑、直率程度、幽默属于作者，不得为了统一而改掉，这条是保留而不是新增。本仓库没有为「补出立场」留开关；确实需要一个立场时，正确做法是按 ALL-PROC-003 问作者。裁决依据是 criteria.md 第 1 条：protection 优先于 style-opinion。本条同时与两条 protection 冲突——ALL-PROT-001 禁止新增原文没有的观点，ALL-PROT-018 禁止为了显得像真人而添加原文没有的感受和第一人称——两条都取，本条记 rejected，冲突按第 8 条双记。
