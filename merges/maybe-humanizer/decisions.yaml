  rationale: 来源列的是八个模式族，本仓库按自己的 references 结构并成四组（对应 protection、patterns-common、patterns-zh/en、以及格式残留类规则），这是记 adopted-with-modification 的原因；并成四组是为了让每一组都能对上一个 references 文件，避免出现记不住的清单。可判定：改动说明里能不能说出四组各自的结论。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 的容忍度矩阵与本条正面冲突：它给 22 条规则在六个语境档位上各取一种强度，四个取值里的 skip 定义为「这个档位下不审这一类」，而本条明写「不得因为体裁不同就整组跳过」。 裁决取本条。理由按 criteria.md 第 1 条：本条的四组里第一组是事实与证据，整组跳过意味着某个体裁下可以不查事实保护——那不是强度问题。他那套 skip 在他自己的表里落在破折号、加粗过量、过渡词这类纯排版规则上，粒度其实比本条的「组」细一档，他跳过的是单条模式规则不是整组检查；本批据此立 ALL-G-008，把语境档位的强度调整限定成三档（标准、放宽、加严），单条 pattern 规则可以放宽到「只处理明显的」但不设「完全不审」，protection 类和本条的四组检查一律不取强度。分域已在 ALL-G-008 的 relations 里记成 excepts。 上游那张表上方的一句话本批照收，它堵的漏洞在本仓库同样成立：没有写进强度表的规则一律按标准强度在所有档位执行——把一张部分覆盖的强度表当成完整清单，会让没列出的规则悄悄失效。 上游那个场景成立时怎么开启：某条规则在某个体裁下确实一次都不该触发的，按 ALL-PROC-025 写进项目自己的 style guide 由用户显式关掉，并按 ALL-PROC-057 在输出里声明。本仓库不留「按体裁自动关掉一整类检查」这个开关。 【全局复核补记】与 ALL-M-022 的关系从 pairs-with 改成 ALL-M-022 单向 excepts 本条，理由见那条的 rationale：本条禁止的是按体裁整组跳过，ALL-M-022 允许的是按资源排处理顺序并声明未查部分，两者不是同一个维度。
