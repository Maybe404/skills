  rationale: 上游给了修法 "Replace with plain language."，并给每一条配了一到两个平实的替代词。十一条的共同点是它们都有一个更短的日常说法，用长的那个不增加信息，只增加一层职场语域——依据是替换表每一行右列都比左列短且更常见。 现有的 EN-P-001 是 AI 高频词表，与本条只有 game changer 一条重合；circle back、on the same page、take a step back、double down、moving forward 五条是英文职场用语，现有规则完全没有覆盖这一类，而中文侧的 ZH-P-001 早就收了对应的一批（赋能、抓手、闭环、底层逻辑、颗粒度、打法）。这个不对称本身就是采纳本条的理由。 改的是例外：上游没有给任何一行写例外，本仓库按 ALL-PROT-031 的口径补一条——保护依据是这个词在当前句子里的具体含义，deep dive 作为产品名或某个团队的固定说法时不动。词表照录自 upstream-hardikpandya-stop-slop，说明文字为重写。按 criteria.md 第 2 条（逐词匹配）和第 3 条采用。
