  rationale: 上游给的观察成立，判据的形式部分也可圈——一个对比句的后半只剩一个助动词（didn't / doesn't / isn't / wasn't）而省掉了整个谓语，这个形状能逐句认出来。他自己把这条整条留作判断题，理由写得很清楚："only density across a piece distinguishes voice from tic"——单独一处是正当风格，只有全篇的密度才能把声口和习惯性动作分开。 记 reference-only，缺的正是那个密度阈值。上游给了例子（一篇三处）但没有给数字，而本仓库按中文批的口径不引入一个没有依据的新阈值（英文批一处理 EN-P-048 时同样沿用了已有的「连续三段以上」而不是自造一个数）。没有阈值时这条规则只剩「省着用」，按 criteria.md 第 2 条圈不出一句话里哪里违反了它——命中与否取决于别处有几处，而「几处算多」没有答案。 与 EN-P-025 的分工：那条管戏剧化的碎片句（That's it. That's the whole thing.），判据是句子的完整性；本条的句子是完整的，省掉的是后半的谓语。两条不重叠，所以 EN-P-025 接不住这个现象。 怎么开启：用户或项目明确要求「对比句写完整、不留光秃秃的助动词」时照本条做，按 ALL-PROC-025 写进项目自己的 style guide；做法写进 references/optional.md。要把它变成默认规则，缺的是一个可数的密度阈值——按本仓库自己的英文样本数一遍真人写作里这个形状的出现频率，就能定。
