    rule_id: ALL-PROC-014
    note: 本条在草稿阶段跑，查的是改写过程自己最容易引入的四处问题；ALL-PROC-014 在交付前跑，是完整清单。
  - type: excepts
    rule_id: ZH-M-003
    note: ZH-M-003 的整篇朗读因为判据不可判定只作参考；本条把「朗读会发现什么」落成四项可判定的检查，不要求朗读这个动作本身。
  - type: pairs-with
    rule_id: ALL-PROC-054
    note: ALL-PROC-051 的四项复查在草稿阶段做，与内置复扫同属流程自带的检查，一并计入本条的轮数。
  rationale: 上游写的是 "Write a draft. Read it aloud."，然后列了四项要查的东西：节奏、细节、is 和 has 这类简单动词、正式程度。朗读这个动作助手执行不了，但他列的四项里有三项可以逐项判定，其中第三项是本仓库现有清单完全没有的——它查的是改写过程自己引入的新痕迹：EN-P-015 管的是原文里的替身词，管不到执行者在重写句子时新加进去的那些。 本仓库因此把"读出声"转译成这四项复查，不照录那个动作。照录会得到一条谁都能说自己做过、又核不了的步骤，那正是上一批 ZH-M-003（整篇朗读检查）被记 reference-only 的理由（criteria.md 第 2 条）。转译之后四项都能问出是或否，按第 2 条和第 3 条采用；转译本身是本条记 adopted-with-modification 的原因。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条一条证据，正是本条当初要转译的那个动作：朗读测试——一段文字如果能被语音合成引擎读出来而不觉得别扭，多半就是太均匀了，人写的文字有抗拒机械朗读的节奏。他的判据（能不能被机器朗读得毫无别扭）与中文侧 ZH-M-003 的判据（读起来像不像中文母语者写的）一样需要判断，两条都因此没有进默认规则。本条把这类整篇层面的经验判据转译成四项可判定的检查，本批不改；上游这条证据说明这个转译的必要性在两个来源上都成立——两份来源各自给了一个不可执行的朗读动作，而它们真正想查的东西（句长有没有变化）本条第一项已经覆盖。
  history:
  - decision: adopted-with-modification
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
- id: ALL-M-020
  local:
