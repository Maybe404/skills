  rationale: 上游只写了 "Change prose only. Keep code blocks, YAML metadata, data, and link targets unchanged."，没有给理由。这四类的共同点是改动会产生功能后果而不只是阅读后果——代码跑不通、元数据解析失败、链接失效；它们不是按重要性选的，是按"改了会坏"选的。 本仓库现有的 ALL-PROC-016 只挡住了代码块和引用块，ALL-PROT-032 的五类里没有链接目标和 frontmatter，而链接是散文里最常见的一种内联结构：把 `[见这里](./a.md)` 的显示文字改顺一点很自然，顺手动到括号里的路径就是坏掉，而且坏了不影响阅读、交付时看不出来。按 criteria.md 第 1 条（链接目标丢失等于原文的指向丢失）和第 2 条（能指出改了哪个字符）采用。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条一条与表格有关的证据，理由写得比本条更完整：引用的内容、代码块、表格和标明是别人写的文字一律只标记不改写，其中表格是参考内容，单元格里的命中只报告、留在原处，"because a wording fix is not worth risking the data the table exists to carry"。这是一处价值失衡的判断——改写的收益是措辞更顺，成本是可能改坏表格里的数据，后者不可接受。本条的清单已含数据块（表格里的数值），上游多说的是「整张表作为一个受保护单位」这一层：一处措辞修正不值得动这张表。ALL-PROC-016 只写了代码块和引用块，没有写表格；这个缺口留给全局复核，记在第 10 节。
  history:
  - decision: adopted
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
