    commit: 8da1f030185bdfe8471220585162991eaeb970e9
    anchor: '## Passive Voice'
  relations:
  - type: conflicts-with
    rule_id: ALL-P-004
    note: ALL-P-004 只禁隐藏施事者的无主句和被动式、优先主动语态，允许施事者不重要或原文没说时用被动；本条是无例外禁令。取 ALL-P-004。
  rationale: 上游给了理由 "Passive voice hides the actor and drains energy."，修法一律是 "Find the actor. Put them at the front of the sentence."。前半（隐藏施事者）成立，本仓库的 ALL-P-004 收的就是这一半。 不采纳的是无条件那一层和它配的修法。这个修法假设每个被动句背后都有一个可以找出来的施事者，而原文没有说是谁做的时候，执行者只剩两条路：编一个（撞 ALL-PROT-001），或者把责任归给一个原文没有指认的主体（撞 ALL-PROT-022，那条明写改写不得改变一件事是谁做的、谁负责）。ALL-P-004 的写法是"优先主动语态，不用隐藏施事者的无主句和被动式"，施事者不重要或原文确实没说时被动句留着——这是本仓库要的口径。 三个英文来源在这一点上强度不同：blader §13 写的是带条件的 "Use active voice when it makes the actor and action clearer."（已作为证据并进 ALL-P-004），只有本条不带条件；这个来源四份文件里一条 protection 规则都没有，它的删改主张在没有任何保护条款兜底的情况下是无上限的。按 criteria.md 第 1 条。 他那个场景成立时怎么开启：项目要求全文主动语态的，按 ALL-PROC-025 用项目自己的 style guide 覆盖默认值。本仓库不设这个默认。
  history:
  - decision: rejected
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
