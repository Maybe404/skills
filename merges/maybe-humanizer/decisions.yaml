  rationale: 上游把理由完整写了出来——"These are constraints on the editor, not detections on the text... The difference is provenance, which no pattern can see, so it lives with the rewrite instructions where the decision is actually made." 他针对的现象是一种可预测的误伤：把「不许有第一人称」写成检测规则之后，作者本人写的第一人称会被一并标记，而那正是 ALL-PROT-017 要保住的东西。 本仓库采纳，理由是这条对本仓库正文怎么组织 references 有直接影响，而不只是一条写作规则。现有的 ALL-PROT-018（不得添加原文没有的第一人称、感受、经历）已经是改写侧约束，EN-P-034、EN-S-002 是检测侧和风格侧——三条散在不同文件里，没有一句话说明为什么它们不能合并。本条把这个组织原则写死：模式目录（patterns-*.md）只放能对着一段文本判定的规则，改写侧禁令放 protection.md，两边不互相搬。 落地时的检验：patterns-en.md 和 patterns-zh.md 里的每一条，拿一段来路不明的文本去判定都应当成立；判定结果依赖「这句话是谁写的」的，说明它放错了文件。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。
