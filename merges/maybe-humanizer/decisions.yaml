  rationale: 两个独立来源。可判定：换掉的两个词指的是不是同一个东西。例外见 ALL-PROT-009：精确技术术语的重复是正确用法，不得为避免重复而换称。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条一条证据，并把反向判据也写死了：同一个名词或动词在一段里出现三次而它就是最准的那个词，三次都留着，强行变化读起来是查同义词典（"Human writers repeat the clearest word."）。他写这条反向判据是为了不让这条规则被反过来用成「必须换词」。本条现有的正文写的是「一个清楚的词够用就重复用它」，覆盖了这一层。 一处范围差别：上游把命中范围限定在同一段之内，本条不限范围。同一段这个限定更严也更可判定，但本条不限范围时能抓到跨段的逐次升格（EN-P-020 管的正是这一种）；两条合起来覆盖两种范围，本批不改。
