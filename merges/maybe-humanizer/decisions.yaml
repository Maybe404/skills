  rationale: 上游明确写了这条不是关于作者身份的证据，而是清晰度和节奏的编辑（"not proof of AI authorship"），并要求先读完上下文再判断解释是不是真的缺失。他防的是把一种修辞手法本身当成罪状——铺垫加反转是真人常用的写法，问题在它被用来顶替一个从未写出的解释。 本仓库采纳。EN-P-009 管的是假戏剧停顿和修辞性设问（The catch?、Sound familiar?），判据是这个停顿有没有信息；本条管的是跨句的铺垫与反转，而且带一个可数的门槛和四类通过条件，EN-P-009 两样都没有。 改的地方有一处：上游没有写「向作者要那个失败原因」之外的出口，本仓库把它接到 ALL-PROC-047（一句话需要一个原文没有的细节时只有两个合法动作：向用户要，或者改写成一句不需要这个细节的说法）——后一个动作在这里同样成立，把两句反转合成一句不带反转的陈述不需要那个原因。 上游的「不得替作者编造失败原因（磁盘故障、网络分区、时钟漂移）」这条禁令本条照收，它与 ALL-PROT-001 同源，是那条在这个具体句式上的落地。 本条按 ALL-M-023 属于需要读上下文才能判定的一类，标记时要与出处相关的命中分开列。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。
