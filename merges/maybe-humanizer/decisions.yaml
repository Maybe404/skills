  rationale: 这条堵的是防误杀规则被滥用：执行者一旦知道「技术文本要保护」，很容易把整段技术文本当成免检区，于是「本次评测充分验证了方案的优越性」跟着指标名一起留了下来。上游要求保护落在词一级且要有依据，并把两条常见的假依据单独否掉——按文本类型整体豁免，以及拿一个想象出来的团队约定当理由。第三句（原文用了某个说法不等于项目要求保留）堵的是把现状当规范。现有 ALL-PROT-009 给了三类例外，但没有说例外的判定粒度和举证方式。可判定：对每一处保留，说出它的依据是当前句子里的哪个语义，还是哪一份明确给出的约定。
