  rationale: 上游只给了两个字的问题命名 "Narrative template"，没有解释。从这一节的标题（Formulaic Constructions）推断，他反对的是这个句式的可预测性——它是个人叙事文章的固定开场，一旦用上，后面的形状读者已经能猜到。 本仓库不采纳。EN-P-007 明写"开头如果是能带出语境、张力或人物的个人化插叙，保留"，而 "By the time I joined the team, I was the third person to own the scheduler." 正是这类插叙的一个常见形式：它带出了时间、人物和一个具体的事实，三样都不是套话。上游没有给出这个句式区别于真人写作的判据，只给了一个命名，按 criteria.md 第 3 条第 2 项（这条规则说的现象是否真实存在、反例是否成立）不采纳。 他那个场景成立时怎么开启：这个开场如果确实不带信息（"By the time I got there, I was tired." 之后不再提这件事），它命中的是 EN-P-007 的清嗓子判据，由那一条处理。本仓库不把这个句式本身列成禁用骨架，因为禁用一个句式和禁用"不带信息的开场"是两件事，前者会连带删掉带信息的那些。
