    note: EN-P-030 删的是与句子实际语气自相矛盾的保留语，本条删的是以否定对偶表演坦诚的那一种；判据不同，两条各管一半。
  - type: excepts
    rule_id: ALL-PROT-004
    note: 原文真实表达的不确定不动；本条只处理不指向任何具体例外的否定对偶。
  rationale: '上游给了问题命名 "Hedging disguised as reassurance"，判据写在命名里：形式是让步（看起来在承认局限），实际是保留语（没有承认任何具体的局限），让作者显得诚实而不必付出诚实的代价——依据是 disguised 这个词。 现有的 EN-P-030 判据是"保留语与句子的实际语气自相矛盾"，管不到这一种：Not always. Not perfectly. 与前一句的语气并不矛盾，它只是不指向任何东西。 改的是门槛：上游不带频率口径（四份文件里唯一的数量判据只有"连续三句同长"和"低于 35/50"两条），本仓库按 ALL-M-002 的口径补一条——单处否定对偶可能是作者真的在收一句话，反复出现才是表演。按 criteria.md 第 2 条（能圈出那两句）和第 3 条采用。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条一条证据，independent_sources 从 1 增到 2。英文批一的报告附 C 第 2 条留了一个要核的问题：本条与本来源用了完全相同的例句 "Not always. Not perfectly."，例句相同通常意味着共同来源而不是独立观察，需要核一次。本批核过了，结论是无法确认同源：本来源自述这一条改编自 welttowelt/stop-slop-refined（issue #108），upstream-hardikpandya-stop-slop 的四份文件里没有任何出处声明，两者的声明对不上，而 welttowelt/stop-slop-refined 不在本仓库的 sources.yaml 里，无法查证 hardikpandya 是否也引了它。因此本批按工具口径把 independent_sources 记为 2，并把这个不确定记在这里——这个数字没有参与任何裁决。 本来源多给的内容：命中条件写窄了（只有在一段里反复出现、用来摆出诚实的姿态却不说清主张在哪里失效时才算），通过条件写全了（两个有内容的让步保留，孤立而有意的一对保留），末尾加了一条硬约束——绝不替作者发明一个失败情形。第三样是本条现在没有的，它与 ALL-PROT-001 同源，是那条在这个句式上的落地；本条现有的正文只写了「写出真实的例外场合，或者删掉这两句」，没有写「不得自己编一个例外场合」。记进第 10 节。 本条按 ALL-M-023 属于需要读上下文才能判定的一类。'
