  rationale: 这条把「这篇文章其实没东西」变成了可判定的：压缩之后剩多少，是能数出来的。它区分了两种完全不同的问题——表达有问题（能改）和材料不足（改不了），而模型默认会把后者当成前者处理，结果是换一套说法把篇幅填回去，AI 味没减、信息也没增。ALL-M-001 的可移植性测试判的是单句，判不了整篇的材料密度。三条限制各堵一个出口：不替作者设计补法（那是作者的活，也容易变成编内容）、不用换说法填篇幅、不能因为材料不足就不清理。注意本条的结论只在审稿模式下说出口，改写模式下即使看出来也不评价（按 ALL-PROT-012）。
