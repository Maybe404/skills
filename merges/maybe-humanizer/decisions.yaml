  rationale: 上游在 references/structures.md 里给了理由 "Empty emphasis"——他认为副词承担的是空的强调；并且把判据写成纯词形（No -ly words）而不是"不承担强调的副词"，换来的是可判定性和执行成本。这个取舍讲得通：判词形不用判断，判功能要判断。 本仓库不采纳，理由不是它太狠，是它会改掉事实。英文里有一批副词承担的是命题的限定（possibly、probably、roughly、approximately、arguably），删掉它们会把一个有条件的主张变成一个确定的主张，这正是 ALL-PROT-004（不得把原文表达的不确定说成确定）和 ALL-PROT-023（情态与强度这两项在改写稿里必须逐项找得回来）禁止的。按 criteria.md 第 1 条，protection 优先于 style-opinion。 本仓库处理同一现象的是 EN-P-003，它的词表与上游十五条重合十条（just、literally、honestly、simply、actually、truly、fundamentally、inherently、inevitably、importantly、crucially），上游多出 really、genuinely、deeply、interestingly 四条——这四条本仓库认为可以补进 EN-P-003 的词表，但补词表是改一条已 human-approved 规则的正文，本批不做，留给全局复核（见报告第 10 节）。 他那个场景成立时怎么开启：项目要执行"一个副词都不留"的口径，按 ALL-PROC-025 用项目自己的词表覆盖默认值；本仓库不把它设成默认，也不留全局开关。
