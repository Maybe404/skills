  rationale: 上游把三种模式（rewrite / detect / edit）绑到用户的措辞上，理由是三种模式对应三种不同的授权强度（只看 / 给我一份新的 / 动我的文件），把判断绑在措辞上是为了不让助手替用户决定授权范围。他给 edit 这一档单独加了「最小、定点」的限定，另外两档没有——因为 edit 的改动是就地生效、用户不一定逐行看的，rewrite 交出一份可以比对的新稿，edit 不交。 本仓库现有的 ALL-PROC-007 只有审稿和改写两档，两档的产物都是回给用户的文本；「动用户的文件」这一档一条都没有，而 ALL-PROC-017（文件是源代码或配置就停下）和 ALL-PROT-037（改写整份文件时链接目标、frontmatter、数据块逐字不动）两条都已经预设了这一档的存在——它们是为这一档写的约束，却没有一条规则说明这一档本身是什么。本条把它补上。 改的地方有三处。一、上游的模式判定靠一串触发词（detect / flag only / scan 一类），本仓库不引入触发词表，判定依据按 ALL-PROC-005 仍然是用户的措辞，本条只规定「点名一个文件并要求就地修改」这一个条件。二、上游写的是「拒绝源代码、配置和生成的数据文件」，本仓库直接指向 ALL-PROC-017，那条已经给了完整的文件类型清单。三、加了一条上游没写的绑定：这一档下 ALL-PROT-037 的三类逐字保护和 ALL-PROT-040 的批量步骤边界照常生效，因为就地改文件时被改坏的东西没有第二份副本可以对照。 与 ALL-PROC-015 的分工：那条是超长输入时事后写明处理范围，本条是长文件动手前先确认范围——方向相反，两条不冲突，因为 edit 改的是用户的文件，范围失控的代价由用户承担，所以范围决定权要事前交回去。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。
