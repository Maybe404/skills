  rationale: 上游把这一项混在 `### What not to flag` 清单里，但它的措辞是 Keep… 而不是 Do not treat as proof，处置方式与同一份清单里其余各项都不同（那些是"不算证据"，这一项是"必须保留"），因此拆规则时单独成条。他针对的现象是 §24（保留语堆叠）和 §34（回应没人提的反对）这两条规则最容易造成的误伤：安全提示、范围声明和真实答复在形式上就是限定和辩解，按形式清理会把内容一起删掉。 本仓库采纳，并把 language 从上游的 en 改成 both——判断"这段是不是安全提示"不依赖语言，中文文档同样会出现这五类内容，正反例不需要为两种语言各写一组（extraction.md 禁止把英文例子直译，这一条不涉及词形，所以不受影响）。按 criteria.md 第 1 条：删掉安全提示会让读者失去原文给的条件和风险，属 protection，优先于本条 relations 里那三条 pattern 规则。第 2 条也成立：五类内容各自能指认，问"这句是不是适用范围声明"能得到是或否。
  history:
  - decision: adopted
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
- id: ALL-PROT-037
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/protection.md
    anchor: '### ALL-PROT-037 链接目标与文件元数据逐字不动'
  category: protection
  language: both
  rule_summary: 改写整份文件时只动散文段落：链接目标（URL、锚点、相对路径）、文件头的 YAML frontmatter、以及数据块（表格里的数值、CSV、配置片段）逐字不动，包括它们内联出现在散文中间的时候。链接的显示文字属于散文，可以改；括号里的目标不可以。
  decision: adopted
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-blader-humanizer
    path: SKILL.md
    commit: e2e92e7b4b8229253ed5c8e81dc65463fdeddda5
    anchor: '**File mode.**'
  relations:
  - type: pairs-with
    rule_id: ALL-PROT-032
    note: ALL-PROT-032 列的五类是数值指标名、命令、接口名与参数名与字段名、日志报错原文、引用原话；本条补的是链接目标、YAML frontmatter 和数据块三类，判据相同——改了会产生功能后果，不只是阅读后果。
  - type: pairs-with
    rule_id: ALL-PROC-016
    note: ALL-PROC-016 把代码块和引用块整体标出跳过；本条管的是不在代码块里、混在散文中间的链接和文件元数据。
  rationale: 上游只写了 "Change prose only. Keep code blocks, YAML metadata, data, and link targets unchanged."，没有给理由。这四类的共同点是改动会产生功能后果而不只是阅读后果——代码跑不通、元数据解析失败、链接失效；它们不是按重要性选的，是按"改了会坏"选的。 本仓库现有的 ALL-PROC-016 只挡住了代码块和引用块，ALL-PROT-032 的五类里没有链接目标和 frontmatter，而链接是散文里最常见的一种内联结构：把 `[见这里](./a.md)` 的显示文字改顺一点很自然，顺手动到括号里的路径就是坏掉，而且坏了不影响阅读、交付时看不出来。按 criteria.md 第 1 条（链接目标丢失等于原文的指向丢失）和第 2 条（能指出改了哪个字符）采用。
  history:
  - decision: adopted
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
