    note: ALL-PROT-013 不许改掉文本的时代特征，本条不许把 2022 年 11 月 30 日之前的文本当 AI 输出处理；两条一起管住「旧文本」这一类。
  - type: excepts
    rule_id: ALL-M-002
    note: 时间判据成立时不再看模式聚集，本条优先于 ALL-M-002 的聚集判据。
  rationale: 上游给了这个日期的含义（ChatGPT 的公开发布日）和结论（"Anything older than that is, with very rare exceptions, not AI-written."）。这是全文唯一一条不看文本本身、只看元数据的判据，判定力强于任何模式。本批直接核对了 Wikipedia:Signs of AI writing 的 `Age of text relative to ChatGPT launch` 一节，原文是 "if an edit was made before November 30, 2022, AI use can be safely ruled out for the corresponding text"，并且写明 Wikipedia 上判断这个时间靠的是版本历史工具（Who Wrote That、WikiBlame）。 这一点正是本仓库要改的地方：Wikipedia 的编辑带时间戳，用户粘进来的一段文字不带，上游把这条判据直接搬过来时没有处理这个差异。本条因此加了来源要求——时间必须来自外部可核验的记录。加这条限制的理由按 criteria.md 第 3 条第 2 项：没有来源要求时，这条判据可以被一句"这是我 2019 年写的"关掉，那样它挡不住任何东西，反而给绕过检查提供了借口。有来源要求时它挡住的是本 skill 最坏的一种失败——把真人在 2022 年之前写的东西当成 AI 输出改掉（那种情形按 ALL-PROC-022 应当停手）。
  history:
