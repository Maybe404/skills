  rationale: 上游没有说明为什么要做字符搜索。推断：破折号在通读时最容易被漏掉——它不影响句子的可读性，眼睛会滑过去；他点名了四种字形（含空格包围的和双连字符），说明他遇到过靠通读漏掉的情形。同一份文件里还有一条要求终稿再执行一次 §14（U-bld-077），这是全文唯一一条被要求执行两次的模式规则，推断的理由是破折号是改写过程本身会引入的东西：重写句子时最容易顺手加一个，草稿阶段查过不等于终稿干净。两条单元判定逻辑相同（都是"这次搜索做没做"），本条合成一条。 本仓库采纳。现有的 ALL-PROC-014 规定了交付前逐项自查，但没有任何一条规则规定对特定字符做机械搜索，而这正是把 EN-P-026 的口径落到实处最便宜的一步——它不需要判断，只需要执行。按 criteria.md 第 2 条（做没做能核）和第 3 条采用。本条与三方破折号口径之争无关：不论 EN-P-026 的阈值最后定在哪里，查法和时机都成立，这也是它单独立条而不并进 EN-P-026 的理由。
