    path: SKILL.md
    commit: d2d0ce27da295581c3cf87a30ab65deb7d0ddfb8
    anchor: '### Pass 1 | 保真回读'
  rationale: 这条抓的是模型最典型的一种编造：不是凭空造事实，而是把同一段里出现的两个东西连起来，连接词看起来非常合理。上游给的判据很硬——必须能回指原文的同一个谓词，共现不算。它还给了一个配套的自查方式，是本批里唯一一条要求「分析结论必须约束输出」的规则：改写前判断过原文没有具体产品，回读时就要确认改写稿里也没有出现产品名。这种前后不一致在长文里很常见，因为分析和生成是两个独立的过程。现有 ALL-PROT-001 禁止新增事实，但一个凭空建立的关系在字面上不像新增事实——句子里的每个名词原文都有。可判定：指出改写稿里这个关系对应原文的哪个谓词，指不出即违反。
