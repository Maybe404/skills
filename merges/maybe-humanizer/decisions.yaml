    note: 本条的第三个条件（句长与段长整齐划一）与 ALL-M-026 的验收要求指向同一件事：结构没动过的稿子不算改完。
  rationale: 上游把这一条放在节奏一节的开场，用来说明后面五条不是可选的润色："If you fix every word on the Tier 1 list but leave the rhythm untouched, the text still reads as AI-generated." 他给的依据是检测工具对结构规整性的权重高于词汇（他点名 Pangram，据其自述在 2800 万篇人写文档上训练分类器）——这个规模和权重排序是上游给的依据，本仓库没有核实过，按 ALL-M-024 不作为已验证事实转述。 本仓库采纳这条规则，但不采纳它的论证方式。上游的理由落在「检测工具怎么排权重」上，而本仓库按 criteria.md 第 5 条第 1 类不采纳以检测器为目标的规则，也不以「能不能被检测器判为人写」作为验收标准。本条改写后的依据换成一件不依赖检测器的事：ALL-P-001 和 ALL-PROC-014 都已经要求句长和段落结构有变化，但两条都没有说这一项与词表命中的关系；实际执行时词表命中是可数的、结构是不可数的，于是可数的那一项总是先被做完、然后交付。本条把这个顺序反过来写死一个可核对的下限——交付前要能指出这一遍在句长或段长上改了哪一处。 与 ALL-P-001 的分工：那条给的是判定口径（连续三句以上落在同一档即命中），本条给的是验收要求（清完词表还得动过结构）。 边界：本条要求的是「动过」而不是「改到某个分布」，因为原文本来就有变化时不该为了满足这条再去改（ALL-PROC-029、ALL-PROC-056）——那种情况下写明「原文的句长本来就有变化，本遍未改」同样满足本条。
