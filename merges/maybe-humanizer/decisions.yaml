    rule_id: EN-P-039
    note: 边界：EN-P-039 管看起来像真的、无法核实的东西（精确到小数位却无法核实的统计数字、归到查不到的来源的引用、对冷门事实的自信断言），它们没有任何形式标记说明作者没有依据，删掉会丢掉一条也许成立的信息，处理动作是标出来交作者确认；本条管自带保留语式填空标记的猜测（likely began、appears to have studied、is believed to have），形式本身就是没有依据的信号，处理动作是删掉或换成有出处的事实。判定顺序：先看这句话有没有保留语式的填空标记。
  rationale: 上游写的是模型 "could not find a source, then fill the gap with a plausible guess"，并点名了那个特定的推理错误：把"没有记录"当成"这个人低调"的证据，再从这个虚构的性格推出更多细节。这是全文里对编造机制描述得最具体的一条。 拆规则时这一条的 Wikipedia 归属存疑。本批核对了 Wikipedia:Signs of AI writing 的 `Knowledge-cutoff disclaimers and speculation about gaps in sources` 一节，那里明确写了这一段，并且用了同样的两个例句 "maintains a low profile"、"keeps personal details private"，还写明这类说法连"没有记录"这个前提本身都是推测（"This information is entirely speculative (including the very claim that it's 'not documented')"）。归属确认为 Wikipedia：本条与 upstream-aboudjem-humanizer-skill 同源，不构成第二个独立观察；但确认之后它的判据也更硬了——五种句型都能逐词匹配。按 criteria.md 第 1 条（这些句子是新增原文没有的事实主张）和第 2 条采用。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条一条证据，触发词与本条现有的清单大面积重合（maintains a relatively low public profile、is believed to have、likely began his career in、appears to have studied），并给了本条现在没有的一条排序判断：这一类比知识截止免责声明更糟，因为那种句子承认了缺口，这种句子把缺口藏在听着合理的填充后面，读者分不清哪些是已知的、哪些是编的。上游自述这一条改编自 blader/humanizer P21，而本条在英文批一正是从 blader §21 立起的——两者同源，不构成两个独立观察，本条的 independent_sources 按工具口径（sources.yaml 的 lineage 去重）填为 2，实质判断记在这里。 本批同时处理了本条与 EN-P-039 的处理动作分歧，那是英文批一留下的一处未裁决的重叠。EN-P-039 要求疑似捏造的痕迹标出来交作者确认、不自行删除也不自行改写；本条和上游都要求删掉猜测或换成有出处的事实。两条按对象分域，不按处理动作取舍：EN-P-039 管的是看起来像真的、无法核实的东西（精确到小数位却无法核实的统计数字、归到查不到的来源的引用、对冷门事实的自信断言）——那些可能是真的，删掉会丢信息，所以标出来交作者。本条管的是自带保留语、形式上就是填空的猜测（likely began、appears to have studied、is believed to have）——那些的形式本身就说明作者没有依据，留在正文里读者分不清哪一句有依据，因此处理动作是删掉或换成有出处的事实。分域已记进 relations 的 excepts。
  history:
  - decision: adopted
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
- id: EN-P-046
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/patterns-en.md
    anchor: '### EN-P-046 假备选方案'
  category: pattern
  language: en
  rule_summary: 不引入一个读者不会考虑的备选方案、在一个从句里否掉它、之后再不提；删掉这个假选项，直接说出真正的约束。触发词：A tempting option / approach would be、One might be tempted to、An obvious approach would be、You might think… but、It would be easy to just、Some would suggest。判定门槛按数量：全文只有一处、且它交代了一条真实约束的不标记；几处简短、互不相关的否定聚在同一段里才处理，处理时围绕这一段的主旨重写整段。设计文档、教程和论证里读者会真的考虑的选型比较不算命中。
  decision: adopted
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 3
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-blader-humanizer
    path: SKILL.md
    commit: e2e92e7b4b8229253ed5c8e81dc65463fdeddda5
    anchor: '### 35. Rejecting fake alternatives'
  - type: upstream
    source_id: upstream-blader-humanizer
    path: SKILL.md
    commit: e2e92e7b4b8229253ed5c8e81dc65463fdeddda5
    anchor: One rejected option may be valid.
  - type: upstream
    source_id: upstream-blader-humanizer
    path: SKILL.md
    commit: e2e92e7b4b8229253ed5c8e81dc65463fdeddda5
    anchor: '- **Real alternatives.**'
  relations:
  - type: pairs-with
    rule_id: EN-P-041
    note: EN-P-041 管的是回应原文里没人提出过的反对意见，本条管的是否掉没人会考虑的备选方案；一段文字可以只命中其中一条。
  rationale: 上游给了一个很具体的成因——"This often leaves an old drafting idea in the final text."：写的人考虑过这个方案、否掉了，把这段思考留在了成稿里。这个成因解释了为什么修法是删掉而不是改写。 本条把上游同一节里的三块合成一条规则：主判据（假备选方案）、数量门槛（一处可能是正当的，几处简短不相关的否定才是强信号）、体裁例外（设计文档、教程、论证里的真实选型比较要保留）。合成而不是分立的理由是三块共用同一条判定逻辑——这个被否掉的选项读者会不会真的考虑；分开记会让执行者拿到一条不带门槛也不带例外的删除指令，而那正是 blader 自己在 `### What not to flag` 里防的事。 现有的 EN-P-041 判据不同：它管的是"没人提出过的反对意见"，一段文字可以只有假备选方案而没有假反对。本批核对了 Wikipedia:Signs of AI writing，那里没有对应的信号，本条是 blader 作者自己补的。按 criteria.md 第 2 条（触发词可逐词匹配，数量和体裁两个门槛都能问出是或否）和第 3 条采用。
  history:
  - decision: adopted
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
- id: EN-P-047
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/patterns-en.md
    anchor: '### EN-P-047 全称量词代替真实范围'
  category: pattern
  language: en
  rule_summary: every、always、never、everyone、everybody、nobody 这类全称量词，如果原文并没有主张全称、只是用它代替一个没查过的范围，就换成原文已经给出的具体范围，或者删掉整条主张。原文本来就主张全称、或者全称有依据时保留。不得为了具体而编一个原文没有的范围。
  decision: adopted-with-modification
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 2
  independent_sources: 2
  sources:
  - type: upstream
    source_id: upstream-hardikpandya-stop-slop
    path: references/structures.md
    commit: 8da1f030185bdfe8471220585162991eaeb970e9
    anchor: '## Word Patterns / | Lazy extremes (every, always, never, everyone, everybody, nobody) |'
  - type: upstream
    source_id: upstream-conorbronsdon-avoid-ai-writing
    path: references/patterns.md
    commit: 801c2360f360e38d4316a271b953138e5e166d54
    anchor: '### Moral-adjective category errors / - **Related — gratuitous universal quantifiers:**'
  relations:
  - type: pairs-with
    rule_id: ALL-P-007
    note: ALL-P-007 要求能给具体内容的地方不用抽象词，本条管的是用全称词冒充范围这一种具体形式。
  - type: excepts
    rule_id: ALL-PROT-023
    note: 换范围时不得放宽或收窄原文的范围；原文给不出范围就删掉整条主张，不自己编一个。
  rationale: 上游把问题命名为 "False authority"——全称词借来的是一种作者没有的权威；SKILL.md 的措辞（lazy extremes … doing vague work）补足了另一半：写作者用全称词是因为不想去查真实的范围。两处合起来是完整的理由。 现有规则里没有对应的：ALL-P-007 管的是抽象换具体，EN-P-039 管的是疑似捏造的统计数字，都不覆盖"全称量词当含糊用"这个判据。采纳，改的是修法：上游写的是 "Use specifics instead of sweeping claims."，直接照做会让执行者从原文之外补一个范围——上游自己的正例 "In the three incidents we reviewed" 里的"三次"就是反例里没有的，这一步撞 ALL-PROT-001 和 ALL-PROT-023。本仓库把修法改成两条：原文给了范围就换成那个范围，没给就删掉整条主张。按 criteria.md 第 1 条做的这处收窄；第 2 条成立——六个词可逐词匹配，"原文有没有给范围"能问出是或否。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条一条证据，与英文批一立本条时用的 hardikpandya 那一条构成两个独立谱系的重合，independent_sources 从 1 增到 2。两个来源用了几乎相同的措辞——upstream-hardikpandya-stop-slop 把问题命名为 False authority，本来源写的是 "it borrows authority from a scope the writer cannot check"，都落在「借一个作者查不了的范围来给论断加权重」这一点上。 本来源多给了一层判据：两个条件都要满足才算命中——那个全称主张既无法核实又没有必要（Taught in every first-year biochemistry course 里的 every 去掉之后句子的信息不减）。因此真实成立、且确实在主张全称的句子不在此列。本条现有的正文写的是「原文并没有主张全称、只是用它代替一个没查过的范围」，与这两个条件一致，不改。 decision 不变（adopted-with-modification），多一个来源没有改变任何一处裁决——按 criteria.md 第 3 条，票数不决定采用。
  history:
  - decision: adopted-with-modification
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
