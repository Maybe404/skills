  - type: upstream
    source_id: upstream-blader-humanizer
    path: SKILL.md
    commit: e2e92e7b4b8229253ed5c8e81dc65463fdeddda5
    anchor: '## What to do / 3. **Do not invent facts.**'
  relations:
  - type: pairs-with
    rule_id: ALL-PROC-004
    note: ALL-PROC-004 规定什么时候必须停下来问，本条规定问不到人时还有哪一条路可以走；两条合起来才是完整的处置。
  rationale: 上游把这一句紧接在"不得编造事实"的禁令后面（"If a sentence needs a missing detail, ask for it or use a simpler sentence."），针对的是禁令本身造成的死结：只写"不许编"，遇到确实缺细节的句子执行者就卡住，而卡住之后最省力的出路恰好是编一个。 本仓库现有的 ALL-PROC-004 和 ALL-P-007 都只给了"去问"这一个出口，用户不在场或者不回时那条路走不通。本条把上游给的第二个出口收下来：改写成不依赖那个细节的说法。原文本来就没有这个细节，所以这么写不减少原文的信息量。按 criteria.md 第 3 条采用——适用性（本 skill 每次改写都可能遇到）、准确性（两个动作各自能判定做没做）、无冲突、与体裁无关；第 2 条也成立：给一段反例能圈出那个原文没有、改写稿却写出来的值。
  history:
  - decision: adopted
