  sources:
  - type: upstream
    source_id: upstream-blader-humanizer
    path: SKILL.md
    commit: e2e92e7b4b8229253ed5c8e81dc65463fdeddda5
    anchor: '## Rewrite process / 2. Write a draft. Read it aloud.'
  - type: upstream
    source_id: upstream-conorbronsdon-avoid-ai-writing
    path: references/patterns.md
    commit: 801c2360f360e38d4316a271b953138e5e166d54
    anchor: '### Rhythm and uniformity / - **Read-aloud test**:'
  relations:
