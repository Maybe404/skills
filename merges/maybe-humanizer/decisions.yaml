  rationale: 三个独立来源，四条证据，中英文各自的表现（英文的被动式、中文的“相关行为发生”）不同但判据相同：能不能指出这个动作是谁做的。可判定。例外由 ALL-PROT-001 兜住：原文没写是谁做的时候，不得替它补一个主语，应当问。 【英文批一补记】本批三个来源在这一点上强度各不相同：blader §13 写的是带条件的 "Use active voice when it makes the actor and action clearer."（已作为证据并进本条，与本条口径一致）；hardikpandya/stop-slop 的两条更强——一条要求一处被动都不留（EN-S-007，rejected，与本条双向记 conflicts-with），一条要求每个句子都以人作主语（EN-S-006，rejected，与 ALL-PROT-033 双向记 conflicts-with）。两条被否的共同理由：原文没说是谁做的时候，照它们的修法只能编一个施事者或者把责任归给一个原文没有指认的主体，撞 ALL-PROT-001 和 ALL-PROT-022。stop-slop 的 `## False Agency` 一节里的七行模式表已作为证据并进本条，但那一节的兜底修法（找不到具体的人就用 you 把读者放进那个位置）不采纳——改人称会改变原文的指称范围，那一层归 EN-P-034，本仓库记 reference-only。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条两条证据，都带本条现在没有的通过条件。一是丢主语的碎句与藏起施事者的被动式，修法是点名那个行动者，除非行动者确实无关紧要；例外写得很具体——以简省为常规的参考类语域里碎句就是正确形式（README 的功能清单、变更日志条目、参数文档、commit 标题），在流水散文里标记、在文档和随意语域里跳过，为强调而有意用的单个碎句是节奏不是痕迹。二是假施事：只有当确实有某个人或某个团队做了判断或选择、且点名他们对这一段是重要的时候才标记（The decision emerged after the offsite），并把三类通过条件写死——惯例性的拟人（the data shows adoption is early）、系统的字面行为、集体简称（the market rewards shipping）。他还在这一条上加了一条硬约束：点名只能用原文已经给出的人，否则只能去问是谁决定的，不得替原文补一个「我们」、一个团队或一个解读数据的人——这一条与 ALL-PROT-022 和 ALL-PROT-001 同源，是它们在这个句式上的落地。 本条现在是无条件的，上述两组通过条件本批没有并进正文（要改一条 human-approved 规则），记进第 10 节。第二条上游自述改编自未登记的 welttowelt/stop-slop-refined。
  history:
