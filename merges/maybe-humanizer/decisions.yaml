- id: EN-S-010
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/conflicts.md
    anchor: null
  category: style-opinion
  language: en
  rule_summary: 句子不以 What、When、Where、Which、Who、Why、How 开头；命中时重构句子，让主语或动词打头（"What makes this hard is..." 改成 "The constraint is..."），更好的做法是直接说出那个具体的约束。
  decision: reference-only
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-hardikpandya-stop-slop
    path: references/structures.md
    commit: 8da1f030185bdfe8471220585162991eaeb970e9
    anchor: '## Sentence Starters to Avoid / | Sentences starting with What, When, Where, Which, Who, Why, How | Restructure. Lead with the subject or the verb. |'
  relations:
  - type: excepts
    rule_id: EN-P-032
    note: EN-P-032 管长文小标题不用问句，本条管正文句子的句首；两条范围不重叠。
  rationale: 上游给了理由 "Wh- openers become a crutch."，并用例子说明了他反对的具体形态：`"What makes this hard is..."` 这类 wh-分裂句把论断推迟到句子后半，与他另一条"泛泛断言"（本批并进 ALL-P-007）指向同一个问题的两个面；他还给了两级修法（先重构，更好的是直接点名那个具体的东西）。观察成立，判据也是纯形式的、可以逐句判定。 不进默认规则的理由是适用范围：这是一条纯词形判据，命中的不只是分裂句——"Which team owns this table is unclear."、"When the retry fires, the health check has not run yet." 这类正常句子同样以 Wh- 开头，重构它们不会让文字更清楚。按 criteria.md 第 4 条，这是单一来源的强风格意见（要求一种具体的句法偏好），换一个作者、换一个体裁就不成立，记 reference-only，做法写进 references/conflicts.md 的可选项一节。 他那个场景成立时怎么开启：用户明确要求"句子都从主语或动词开始"时照本条做，或按 ALL-PROC-025 写进项目自己的 style guide。他真正指向的那一半——论断被推迟到句子后半、句子说的是"什么让它难"而不是"难在哪"——已由 ALL-P-007 管住。
  history:
