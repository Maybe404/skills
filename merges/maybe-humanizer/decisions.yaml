  - type: upstream
    source_id: upstream-conorbronsdon-avoid-ai-writing
    path: references/patterns.md
    commit: 801c2360f360e38d4316a271b953138e5e166d54
    anchor: '### Formatting / - **Em dashes (— and --)**:'
  relations:
  - type: excepts
    rule_id: ZH-P-007
    note: 英文侧的破折号口径，中文不适用，中文走 ZH-P-007。
  - type: conflicts-with
    rule_id: EN-S-004
    note: EN-S-004 是禁令加作者样本例外，本条是按篇幅分界的密度上限；取本条，样本例外单独立成 ALL-PROC-049。
  - type: conflicts-with
    rule_id: EN-S-009
    note: EN-S-009 是无条件禁令、不设任何频率口径；取本条。
  - type: pairs-with
    rule_id: EN-PROC-001
    note: 本条定密度口径，EN-PROC-001 定交付前的查法和时机。
  - type: pairs-with
    rule_id: EN-PROT-001
    note: EN-P-026 是破折号的频率上限（检测侧），本条规定改写时一处都不得新增，频率没超上限不构成豁免。
  rationale: 两个独立来源给出两种口径，本仓库采用较宽的一种，因此记 adopted-with-modification。Aboudjem 的“零容忍、一个都不用”被否决：破折号是英文的正常标点，零容忍会改掉真人原文里正当的用法，与 ALL-PROT-017 和 ALL-M-002（孤立的破折号不算证据）都冲突；no-ai-slop 的分级口径（短文零个、长文一到两个、去掉成串）同样可判定，且不误伤。中文一侧走 ZH-P-007，判据不同，不受本条约束。这组冲突写进 conflicts.md。试验后修复补上了缺失的分界：上游两条证据都只说“短文”“长文”，没给词数，判据因此无法执行；本仓库定 200 词为界，写进 rule_summary 和 patterns-en.md，evals 样本 4（44 词）的判据同步按短文口径重写。分界之外的口径不变，因此 decision 仍是 adopted-with-modification。 【英文批一补记】本批比对了三方破折号口径，本条的按篇幅分界口径不变，decision 与 decision_revision 均不动。三方是：blader §14（禁令加作者写作样本例外，记 EN-S-004，rejected）、hardikpandya/stop-slop（无条件禁，SKILL.md 与 references/structures.md 三处陈述都不带频率口径，记 EN-S-009，rejected）、以及本条现有的按篇幅分界。不把前两方并进本条的理由有三条。一、两方都没有给出可以与本条比较的密度口径——stop-slop 四份文件里一条频率判据都没有，blader 给的是禁令加例外，都不是「每多少词几处」这个量纲，并进来只会把本条的阈值换成零。二、blader 真正补上的两样东西不是密度口径：作者写作样本的优先级（立成 ALL-PROC-049，与本条记 excepts）和交付前的破折号字符搜索（立成 EN-PROC-001，与本条记 pairs-with）；这两样无论本条的阈值最后定在哪里都成立，所以单独立条比并进来更稳。三、第四方 upstream-conorbronsdon-avoid-ai-writing 的每千词一处上限在下一批，那是唯一一个与本条同量纲、可以直接比较的口径。留给下一批的接口是一个具体问题：每千词一处与「200 词以下零处、200 词以上一到两处」折算之后差多少，两者在 200 到 1000 词这一段的结论差在哪里，以及 blader 的样本例外（ALL-PROC-049）与那个频率上限是不是同一层机制。另核对了 Wikipedia:Signs of AI writing 的 `Overuse of em dashes` 一节，其口径是频率而不是禁令，与本条方向一致；那一节还附了一条 2026 年 7 月的研究——当代模型里只有 Claude 用得比专业写作者多，ChatGPT 用得更少。 【英文批二补记】本条的 rule_summary 本批改过，decision_revision 从 2 加到 3，decision 值不变。英文批一的报告第 5 节 5.1 列了破折号的四方口径并留了接口：前三方（blader 的禁令加样本例外、hardikpandya 的无条件禁、本条的按篇幅分界）里只有本条给出了密度口径，第四方 upstream-conorbronsdon-avoid-ai-writing 的每千词一处上限是唯一一个与本条同量纲、可以直接比较的口径。本批把两种口径折算了三档：200 词时本条按短文允许 0 处、上游按比例折算 0.2 处即 0 处，两者一致；1000 词时本条允许 1 到 2 处、上游允许 1 处，差 0 到 1 处；3000 词时本条仍是 1 到 2 处、上游允许 3 处，上游宽 1 到 2 处。差别的来源是本条的长文那一档是一个固定上限，上游是线性比例，篇幅越长两者差得越多。 并进本条而不是另立一条，理由是它与本条同量纲：另立会让两条同类阈值并存，执行时必须先裁决用哪一条，而这正是本条当初把四方口径收成一条的目的。改法是保留 200 词分界（两方一致），把长文那一档从「至多一到两处」换成「每千词至多一处、向下取整、至少允许一处」——这样 201 到 1999 词的区间由「一到两处」收成一处（比原来严），3000 词以上由固定两处放开到按比例（比原来宽），两处调整都朝着上游那条线性口径靠。 同时并进三项本条现在没有的误伤控制：两种字形（em dash 与两个连字符的替代写法）一并计入，这一项正好把本条的判定口径与 EN-PROC-001 的四种字形搜索对齐——此前本条只写 U+2014，那条要搜四种，搜出来的东西有三种本条判不了；标题与小标题与正文同样计入；项目符号列表项里跟在加粗引导词或 markdown 链接后面充当分隔符的破折号不计入频率，而句中的插入用法、列表之外行首的 `**Bold lead** — 整句`、以及两个连字符的写法一律不豁免。上游把这条豁免写得很细，理由是他要区分的是排版惯例与散文里的停顿滥用，而不是给破折号开一个口子。 每千词一处是上游的经验值，本仓库没有核过，按 ALL-M-024 在说明里带这个保留。 本批另立的 EN-PROT-001 补上了本条一直缺的另一侧：本条是频率上限，那条管的是改写时不得新增——上游写明了这个分工，"The rule elsewhere is a rate ceiling; this is about *adding* dashes during a rewrite, which should never happen."，他防的是频率上限被当成配额用。 与 ALL-PROC-049 的 excepts 关系不变：用户提供了作者写作样本时，样本的破折号频率优先于本条的默认口径。英文批一记 rejected 的 EN-S-004 与 EN-S-009 的 conflicts-with 关系不变，两条的裁决理由不受本批修改影响——它们拒的是无条件禁令这个口径，与本条的阈值定在哪里无关。
