  rationale: 上游把"AI 爱凑三项"这个观察反向写成了生成期的偏好——不是"发现三项排比就检查是不是凑出来的"，而是"直接改用两项"。他选择在生成侧下手而不是检测侧，代价是三项本来就成立的场合也会被压成两项。 本仓库不采纳：原文确实有三件事时，压成两项要删掉一项，撞 ALL-PROT-003（不得默认做摘要式压缩）。ALL-P-005 处理同一个现象而不需要动内容——判据是这三项是不是为了凑气势才排在一起，是就重建结构，不是就留着。按 criteria.md 第 1 条。上一批 op7418 的 ZH-P-012（并列项默认取两项）按同一条理由记 rejected，中英两侧结论一致。 还有一处可以写给作者看的事实：上游自己的 references/examples.md 的 Example 4 里，标为"正确改法"的 After 文本仍然保留了三项并列（"Speed, quality, cost—pick two."），他写下的规则强度高于他自己的执行强度。 他那个场景成立时怎么开启：三项排比确实是模板骨架的情形由 ALL-P-005 覆盖；本仓库不另留"默认取两项"的开关。
