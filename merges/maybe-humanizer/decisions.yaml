  rationale: 上游把理由完整写了出来——"a reader skimming for the finished text will otherwise copy section 2 and ship the tells this pass just fixed"。他针对的现象很具体：复扫做对了、修正也对了，但读者略读时抄走的是前面那一版，于是这一遍白做。这是一条关于人怎么读输出的规则，不是关于文字本身的规则。 本仓库采纳，理由是这个失败方式在现有规则下会真实发生。ALL-PROC-007 的改写模式输出「完整改写稿加改动说明」，ALL-PROC-045 规定交付前的回读拆成两步并允许四类轻量修正，ALL-PROC-050 另附一份残留模式清单——按这几条，一次输出里完全可能出现改写稿和修正后的段落两份文本，而现有规则里没有一条说明哪一份是交付版本。ALL-PROT-016 只规定「只处理了一部分的稿子必须标为阶段稿」，管不到两份都完整的情形。 可判定：输出里出现两份完整文本而没有一句明确指出交付版本的，即违反；「见下」「以修正后为准」这类没有指到具体那一份的写法不算。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。
