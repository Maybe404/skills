- id: ALL-M-020
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/patterns-common.md
    anchor: '### ALL-M-020 2022-11-30 的时间判据'
  category: measurement
  language: both
  rule_summary: 文本有可核验的写作或最后编辑时间、且早于 2022 年 11 月 30 日（ChatGPT 公开发布日）时，不按 AI 痕迹处理，只按普通编辑请求处理。可核验指版本历史、提交时间、发表日期这类外部记录；用户口述的日期和文内自称的年份不作为依据。拿不到可核验的时间时本条不生效，按其余规则正常判断。
  decision: adopted-with-modification
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 1
