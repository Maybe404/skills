  category: process
  language: both
  rule_summary: 一句话需要一个原文没有的细节时只有两个合法动作：向用户要这个细节，或者改写成一句不需要这个细节的说法。不得自己填一个看着合理的值，也不得因为缺这个细节就把原句原样留下不处理。
  decision: adopted
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 1
  independent_sources: 1
