    commit: 801c2360f360e38d4316a271b953138e5e166d54
    anchor: '### Formatting / - **Immaculate typography in casual registers**:'
  relations:
  - type: pairs-with
    rule_id: ALL-P-001
    note: 句长有变化是改写时的目标，句长一致本身不是 AI 的证据；两条方向相反但配套，缺一条会误伤。
  - type: excepts
    rule_id: ALL-M-020
    note: ALL-M-020 的时间判据成立时不再看模式聚集。
  - type: pairs-with
    rule_id: ALL-M-021
    note: ALL-M-002 按痕迹的种类判哪些单独出现不算证据，本条按作者与体裁判同一批痕迹的证据强度；两条各管一半。
  - type: pairs-with
    rule_id: ALL-M-024
    note: ALL-M-002 说的是哪些信号单独出现不算证据，本条说的是一条规则背后的统计依据本身有多可靠；两条各管一层。
  rationale: 四条证据，independent_sources 为 1。采用的理由是它直接降低误伤：句长一致可能是写作者本来的习惯，正式语域可能是第二语言写作者真实的声音，按单一信号动手会改掉真人的文字。与 ALL-PROT-012、ALL-PROT-017 同向。可判定：标记某处时能不能在同一段里再指出至少一处其他痕迹。 【英文批一补记】blader 的 `### What not to flag` 一节给了一份比本条长得多的免责清单，本批作为两条证据并进本条。本条现有四项之外，它另外列了七项：正式或学术用词（词表只列了特定的词，不是让你简化每一个正式词）、孤立出现的常见过渡词（一个 however 不是痕迹）、单独一句用于强调的短句（只有连排才标记）、作者刻意重复的句首（为制造节奏或压迫感的重复，只有在重复不带来任何东西时才改）、缺少引用（网上大部分内容都没有引用）、正确而复杂的排版（可视化编辑器和模板不用 AI 也能产出干净输出）、评论里的书信式开头或结尾。本批核对了 Wikipedia:Signs of AI writing 的 `Ineffective indicators` 一节，其中六项与之对应（完美语法、随意与正式混用、平淡或机械的文风、正式或学术用词、孤立的过渡词、缺少引用），另加一条 Correct wikitext；孤立的破折号和孤立的弯引号则分别写在 `Overuse of em dashes` 和 `Curly quotation marks and apostrophes` 两节里。blader 独有、Wikipedia 没有的是「单独一句用于强调的短句」和「作者刻意重复的句首」两项——这两项分别限制 EN-P-025 和 ALL-P-001，值得补进本条的清单，但那要改本条的正文，本批不做，留给全局复核。blader 另有一条判定门槛（一个被否掉的方案可能是正当的，几个简短互不相关的否定才是强信号）已并进 EN-P-046，不重复记在本条。 【英文批一补记·Wikipedia 归属】本批直接核对了 Wikipedia:Signs of AI writing 的原文，blader 在这一条上的模式对应该页面的 `Ineffective indicators`，与 upstream-aboudjem-humanizer-skill 同源，两者在这一条上不构成两个独立观察。independent_sources 这个字段按 upstream-monitor 的口径填（sources 里去重 lineage 之后的数量，两者是两个 lineage），因此本批之后这个数比实质上的独立观察数多一。裁决没有用到这个数字（criteria.md 第 3 条：证据不等于结论）。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条两条证据，都是给「单独出现不算证据」补上语域条件。一是弯引号和弯撇号：只有在纯文本语境里（代码注释、commit message、纯文本草稿这类不会自动转换的地方）才有意义，且只能作旁证，因为 Word、Google Docs、macOS 和 iOS 默认会把直引号转成弯的；弯撇号（U+2019）单独出现一律不标记。二是随意语域里的完美排版（issue 与 PR 评论、聊天、私信里出现完美的空格、标点和大小写）与弯引号同档：弱、限语域、永远不单独成立，他把两个方向的反例都写了出来——细心的真人可以写出一条毫无差错的评论，赶时间的真人也可以写得很潦草。 本条现有的清单里有「一处破折号或弯引号」和「语法和拼写完美」两项，但没有写它们各自只在哪种语域里成立；补上这两层要改一条 human-approved 规则的正文，记进第 10 节。 另有一条本批新立的 ALL-M-021 与本条配套：本条按痕迹的种类判，那条按作者与体裁判。
  history:
  - decision: adopted
    at: '2026-09-06T12:00:00Z'
    reason: 首次合并
