  category: measurement
  language: both
  rule_summary: 判断一份稿子是不是材料不足用压缩试验：删光姿态层、拔高和套话之后，剩下的事实、动作、数字和判断撑不撑得起原文的篇幅；撑不起就是材料不足，不是话说得不对。标注材料不足时写清删完之后还剩什么、缺的是哪一类材料、清理后大约会短多少，不替作者设计怎么去补，也不用换说法把篇幅填回去。
  decision: adopted
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-06T22:00:00Z'
  evidence_count: 3
  independent_sources: 2
  sources:
  - type: upstream
    source_id: upstream-mrgediao-shuorenhua
    path: SKILL.md
    commit: d2d0ce27da295581c3cf87a30ab65deb7d0ddfb8
    anchor: '### Annotation mode / 如果文本的问题是'
  - type: upstream
    source_id: upstream-mrgediao-shuorenhua
    path: SKILL.md
    commit: d2d0ce27da295581c3cf87a30ab65deb7d0ddfb8
    anchor: '### Annotation mode / 不替作者设计怎么去补'
  - type: upstream
    source_id: upstream-conorbronsdon-avoid-ai-writing
    path: references/patterns.md
    commit: 801c2360f360e38d4316a271b953138e5e166d54
    anchor: '### Treadmill effect / low information density (content test)'
  rationale: 这条把「这篇文章其实没东西」变成了可判定的：压缩之后剩多少，是能数出来的。它区分了两种完全不同的问题——表达有问题（能改）和材料不足（改不了），而模型默认会把后者当成前者处理，结果是换一套说法把篇幅填回去，AI 味没减、信息也没增。ALL-M-001 的可移植性测试判的是单句，判不了整篇的材料密度。三条限制各堵一个出口：不替作者设计补法（那是作者的活，也容易变成编内容）、不用换说法填篇幅、不能因为材料不足就不清理。注意本条的结论只在审稿模式下说出口，改写模式下即使看出来也不评价（按 ALL-PROT-012）。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条一条证据，把「材料不足」这个判断落成一个可估的比例：逐段问「这一段新在哪里」，机器散文常常把前提换个说法再说一遍而不是往前推——动作很多、距离为零，判据是能删掉 40% 到 60% 而不损失信息。修法是给每一段点名它贡献的那一个事实、主张或转折，没有就删掉这一段，有就把它提到段首、去掉前面的清嗓子。 本条现有的压缩试验问的是「删光姿态层和套话之后剩下的材料撑不撑得起原文篇幅」，与他的判据同源；他多给的是那个比例区间，本条多给的是一层保护（标注材料不足时写清缺的是哪一类材料，不替作者设计怎么补）。40% 到 60% 是上游的经验值，本仓库没有核过，按 ALL-M-024 不作为已验证结论。上游自述这一条改编自 Aboudjem/humanizer-skill P43，与 aboudjem 的对应单元不构成两个独立观察。
  history:
