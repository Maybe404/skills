- id: EN-P-026
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/patterns-en.md
    anchor: '### EN-P-026 英文破折号'
  category: pattern
  language: en
  rule_summary: 英文破折号（em dash — 与两个连字符 -- 的替代写法，两种字形一并计入，标题与小标题与正文同样计入）按全文词数分界：200 词以下算短文，一处都不用；200 词以上按每千词至多一处折算，向下取整、至少允许一处（1000 词内至多一处，2000 到 2999 词至多两处，3000 词至多三处）。不论篇幅，同一段里出现两处以上算成串，成串出现的和纯装饰性的一律去掉。一种豁免不计入频率：项目符号或编号列表项里、跟在加粗引导词或 markdown 链接后面充当分隔符的破折号（`- **Term** — description`）；句中的插入用法照算，列表之外行首的 `**Bold lead** — 整句` 照算，两个连字符的写法永远不豁免。
  decision: adopted-with-modification
  decision_origin: human-approved
  decision_revision: 3
  decided_at: '2026-09-06T12:00:00Z'
  evidence_count: 3
  independent_sources: 3
  sources:
  - type: upstream
    source_id: upstream-petergyang-no-ai-slop
    path: skills/no-ai-slop/SKILL.md
    commit: 000650b156983f5159695b441477f4e63b25dc85
