- id: EN-S-010
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/optional.md
    anchor: '### EN-S-010 句子不以 Wh- 词开头'
  category: style-opinion
  language: en
  rule_summary: 句子不以 What、When、Where、Which、Who、Why、How 开头；命中时重构句子，让主语或动词打头（"What makes this hard is..." 改成 "The constraint is..."），更好的做法是直接说出那个具体的约束。
  decision: reference-only
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-hardikpandya-stop-slop
    path: references/structures.md
    commit: 8da1f030185bdfe8471220585162991eaeb970e9
    anchor: '## Sentence Starters to Avoid / | Sentences starting with What, When, Where, Which, Who, Why, How | Restructure. Lead with the subject or the verb. |'
  relations:
  - type: excepts
    rule_id: EN-P-032
    note: EN-P-032 管长文小标题不用问句，本条管正文句子的句首；两条范围不重叠。
  rationale: 上游给了理由 "Wh- openers become a crutch."，并用例子说明了他反对的具体形态：`"What makes this hard is..."` 这类 wh-分裂句把论断推迟到句子后半，与他另一条"泛泛断言"（本批并进 ALL-P-007）指向同一个问题的两个面；他还给了两级修法（先重构，更好的是直接点名那个具体的东西）。观察成立，判据也是纯形式的、可以逐句判定。 不进默认规则的理由是适用范围：这是一条纯词形判据，命中的不只是分裂句——"Which team owns this table is unclear."、"When the retry fires, the health check has not run yet." 这类正常句子同样以 Wh- 开头，重构它们不会让文字更清楚。按 criteria.md 第 4 条，这是单一来源的强风格意见（要求一种具体的句法偏好），换一个作者、换一个体裁就不成立，记 reference-only，做法写进 references/optional.md。 他那个场景成立时怎么开启：用户明确要求"句子都从主语或动词开始"时照本条做，或按 ALL-PROC-025 写进项目自己的 style guide。他真正指向的那一半——论断被推迟到句子后半、句子说的是"什么让它难"而不是"难在哪"——已由 ALL-P-007 管住。
  history:
  - decision: reference-only
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
- id: EN-S-011
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/conflicts.md
    anchor: '### EN-S-011 删掉全部保留语'
  category: style-opinion
  language: en
  rule_summary: 除副词之外，软化语、强化语和保留语一律不留（"No softeners, no intensifiers, no hedges."）；判据是这个词在做软化、加强或保留的活，不看它是不是副词，因此 most、to some extent 这类限定词也在范围内。
  decision: rejected
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-hardikpandya-stop-slop
    path: references/phrases.md
    commit: 8da1f030185bdfe8471220585162991eaeb970e9
    anchor: '## Adverbs / No softeners, no intensifiers, no hedges.'
  relations:
  - type: conflicts-with
    rule_id: ALL-PROT-004
    note: ALL-PROT-004 要求原文表达的不确定必须保留，本条要求删掉全部保留语（含 most、to some extent）；取 ALL-PROT-004。
  rationale: 这一句与"删所有副词"同在一行，但判据不同：前半看词形，本条看功能，因此它能命中不是副词的词。上游四份文件里唯一一处演示在 references/examples.md 的 Example 2，那一组的 Changes 写的是 "Cut hedging ('most')"——被删的 most 是限定词。 这正是本仓库不能采纳的地方：把 "Most teams struggle with alignment" 删成 "Teams struggle with alignment"，一个有范围的主张变成了全称主张，撞 ALL-PROT-004（不得把原文表达的不确定说成确定）和 ALL-PROT-023（范围这一项必须逐项找得回来）。上游针对的现象成立——多轮编辑会一层层堆保留语，直到句子什么都没主张；本仓库处理这个现象的是 EN-P-029（不堆叠多层保留语，要么表态，要么只说出那一个真正不确定的点）和 EN-P-030（删掉与句子实际语气自相矛盾的保留语），两条都保留"原文真实表达的不确定不动"这个例外，本条不留。 这个来源四份文件通读两遍，一条 protection 规则都没有，它的删改主张在没有任何保护条款兜底的情况下是无上限的；本仓库按 criteria.md 第 1 条给它补边界，边界就在 ALL-PROT-004。 他那个场景成立时怎么开启：EN-P-029 已经允许把一串保留语压成一个。要连原文真实的限定一起删，本仓库没有留这个开关——那不是风格问题。
  history:
  - decision: rejected
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
- id: EN-S-012
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/optional.md
    anchor: '### EN-S-012 段落不以 So 开头'
  category: style-opinion
