    note: 本条在草稿阶段跑，查的是改写过程自己最容易引入的四处问题；ALL-PROC-014 在交付前跑，是完整清单。
  - type: excepts
    rule_id: ZH-M-003
    note: ZH-M-003 的整篇朗读因为判据不可判定只作参考；本条把「朗读会发现什么」落成四项可判定的检查，不要求朗读这个动作本身。
  rationale: 上游写的是 "Write a draft. Read it aloud."，然后列了四项要查的东西：节奏、细节、is 和 has 这类简单动词、正式程度。朗读这个动作助手执行不了，但他列的四项里有三项可以逐项判定，其中第三项是本仓库现有清单完全没有的——它查的是改写过程自己引入的新痕迹：EN-P-015 管的是原文里的替身词，管不到执行者在重写句子时新加进去的那些。 本仓库因此把"读出声"转译成这四项复查，不照录那个动作。照录会得到一条谁都能说自己做过、又核不了的步骤，那正是上一批 ZH-M-003（整篇朗读检查）被记 reference-only 的理由（criteria.md 第 2 条）。转译之后四项都能问出是或否，按第 2 条和第 3 条采用；转译本身是本条记 adopted-with-modification 的原因。
