- id: ZH-P-030
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/patterns-zh.md
    anchor: '### ZH-P-030 同形词按语义分流'
  category: pattern
  language: zh
  rule_summary: 一个词正在被定义、被讨论，或属于引用原文时保留它（「闭环控制系统」保留）；同一个词被用来包装进展或结论时还原成具体完成了什么（「这块已经闭环了」改成「三步都做完了」）。还原时必须保留原文的「未／只／部分」等完成范围，不得写成全流程已完成。
  decision: adopted
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-06T22:00:00Z'
  evidence_count: 2
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-mrgediao-shuorenhua
    path: SKILL.md
    commit: d2d0ce27da295581c3cf87a30ab65deb7d0ddfb8
    anchor: 词本身正在被定义、讨论
  - type: upstream
    source_id: upstream-mrgediao-shuorenhua
    path: SKILL.md
    commit: d2d0ce27da295581c3cf87a30ab65deb7d0ddfb8
    anchor: 例如 `闭环反馈 / 闭环控制` 是反馈机制
  relations:
  - type: pairs-with
    rule_id: ALL-PROT-009
    note: ALL-PROT-009 从反面给出三类不适用模式清理的例外，本条从正面给出同一个字符串在术语用法和包装用法之间的分流判据，两条合起来才够用。
  - type: pairs-with
    rule_id: EN-P-068
    note: ZH-P-030 是本条在中文侧的对应规则，判据一致；两条分立是因为 references 中英分表、正反例不能直译。
  rationale: 这是全批最清楚的一条「同形词按语义分流」规则，而且上游给了判例（闭环）。它解决的是词表方法的根本缺陷：同一个字符串在不同句子里可能是术语也可能是黑话，只看词表分不开。ALL-PROT-009 已经说了「行业固定表述属于例外」，但没有给出怎么判断一次出现属不属于例外；本条给的判据（这个词在这句话里是被讨论还是被用来包装）可以逐句执行。第二半（还原时保留完成范围）是必须的：黑话本身模糊，还原时模型会补一个「听起来完整」的说法，把「只闭环了前两步」写成「流程已经跑通」。
  history:
  - decision: adopted
    at: '2026-09-06T22:00:00Z'
    reason: 中文批合并
