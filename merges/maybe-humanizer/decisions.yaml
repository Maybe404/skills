  rationale: EN-P-008 已经管英文的故作洞见铺垫，中文侧没有对应词条。上游把它放在正向目标一侧（「立场应当来自判断或事实，不来自故作洞见」），并给了可判定的判据：立场后面有没有依据，而不是立场强不强。它同时是 public-writing 场景的特征病灶——上游给这个场景写的重点就是「不装有洞见」。可判定：删掉这个铺垫之后，剩下的那句话本身站不站得住。
