    anchor: '## Sentence Starters to Avoid / | Paragraphs starting with "So" | Start with content |'
  relations:
  - type: excepts
    rule_id: EN-P-004
    note: EN-P-004 规定承载真实逻辑关系的连接词缩短成表达这个关系的最短说法、不整段删；段落开头承担因果或推进关系的 So 属于 EN-P-004 的范围，本条只作参考。
  rationale: 上游只给了修法 "Start with content"，没有解释；与同节的 Wh- 那一条同源——他反对的是段落开头被一个不承载信息的词占掉，这一节的总结句用了 crutch（拐杖）这个说法。这个现象在自媒体写作里确实存在。 不进默认规则的理由：段落开头的 So 在口语化写作和技术讲解里是正当的话题标记，它常常承担一个真实的因果或推进关系，而 EN-P-004 已经规定这类连接词承载了真实逻辑关系时要缩短成表达这个关系的最短说法、不整段删。一条无条件删除的规则会把这层关系一起删掉。按 criteria.md 第 4 条，这是单一来源的强风格意见（要求一种具体的句首偏好），记 reference-only。 他那个场景成立时怎么开启：用户或项目明确要求段落不以连接词开头时照本条做，按 ALL-PROC-025 写进项目的 style guide。
