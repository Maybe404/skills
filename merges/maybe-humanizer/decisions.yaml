  rationale: 上游的容忍度矩阵给 22 条规则在六个档位上各取一种强度，四种取值是 strict / relaxed / skip / extra strict。他把「没列进表的怎么办」写在表的正上方——"Rules not listed in the table apply at full strength across all profiles."——堵的是一个具体的漏洞：把一张部分覆盖的强度表当成完整清单，会让没列出的规则悄悄失效。他还给四种取值各写了定义而不是留给理解，其中 extra strict 的例子是投资人邮件里一句 "thriving ecosystem" 就能毁掉整封信。 本仓库采纳三种取值和「未列入即标准强度」这条兜底，不采纳 skip。冲突落在 ALL-PROC-010：那条明写「体裁只调整每组的触发门槛和改动幅度，不得因为体裁不同就整组跳过」，而 skip 的定义正是这个档位下不审这一类。裁决取 ALL-PROC-010，理由按 criteria.md 第 1 条：ALL-PROC-010 的四组里第一组是事实与证据，整组跳过意味着某个体裁下可以不查事实保护——那不是强度问题。 上游的 skip 在他自己的表里落在破折号、加粗过量、过渡词这类纯排版规则上，粒度其实比 ALL-PROC-010 的「组」细一档：他跳过的是单条模式规则，不是整组检查。所以本条把边界写成两层——单条 pattern 规则可以放宽到「只处理明显的」，但不设「完全不审」这一档；protection 类和四组检查一律不取强度。这样上游想要的效果（Slack 消息不必按长文口径查破折号频率）由「放宽」这一档承担，而事实保护不会被一个档位关掉。 他那个场景成立时怎么开启：某条规则在某个体裁下确实一次都不该触发的，按 ALL-PROC-025 写进项目自己的 style guide，由用户显式关掉并按 ALL-PROC-057 在输出里声明。本仓库不留「按体裁自动关掉一整类检查」这个开关。
