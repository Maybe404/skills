  rationale: independent_sources 为 1，采用。可判定：这些碎片是不是可以合成一句完整的陈述而不损失信息。例外见 ALL-PROT-017：作者本人的片段句语感要保留，本条针对的是为了制造节奏而批量出现的碎片。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条一条证据，并给了本条现在没有的可数判据：三个以上同形碎片连排、每个都带人造的戏剧性即命中（It had no preference for symmetry. No aesthetic prior. No nostalgia for human taste.）。他写明了它与节奏那一节的关系——那一节鼓励碎片和长短交错，本条命中的恰恰是变化的反面：三个以上同形碎片。修法是留下那个确实挣到了强调的碎片，其余的折回普通句子并把主张说出来。 「三个以上同形」这个判据本条没有，补进正文要改一条 human-approved 规则，记进第 10 节。上游自述这一条改编自 blader/humanizer P31，与 blader 的对应单元不构成两个独立观察。 改写侧的对应本批立成 EN-PROT-001：本条管输入文本里已有的碎片连排，那条禁止改写时把完整句子剁成碎片。
