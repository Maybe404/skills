  rationale: 上游给了一个很具体的成因——"This often leaves an old drafting idea in the final text."：写的人考虑过这个方案、否掉了，把这段思考留在了成稿里。这个成因解释了为什么修法是删掉而不是改写。 本条把上游同一节里的三块合成一条规则：主判据（假备选方案）、数量门槛（一处可能是正当的，几处简短不相关的否定才是强信号）、体裁例外（设计文档、教程、论证里的真实选型比较要保留）。合成而不是分立的理由是三块共用同一条判定逻辑——这个被否掉的选项读者会不会真的考虑；分开记会让执行者拿到一条不带门槛也不带例外的删除指令，而那正是 blader 自己在 `### What not to flag` 里防的事。 现有的 EN-P-041 判据不同：它管的是"没人提出过的反对意见"，一段文字可以只有假备选方案而没有假反对。本批核对了 Wikipedia:Signs of AI writing，那里没有对应的信号，本条是 blader 作者自己补的。按 criteria.md 第 2 条（触发词可逐词匹配，数量和体裁两个门槛都能问出是或否）和第 3 条采用。
