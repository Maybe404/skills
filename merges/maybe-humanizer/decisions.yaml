  rationale: 上游把界线划在能不能被核对——"You may add an opinion or reaction when the writer's voice calls for one, but you may not add a factual claim."。他的判断是观点不可核对，因此加进去不会让文本失真；事实主张可核对，加进去就是引入一个没有出处的断言。他针对的现象成立：一份只做减法的改写会把作者原有的语气抹平成中立报道。 本仓库不采纳，取 ALL-PROT-001。分歧落在"不可核对"这一点上：上游把它当成许可的理由，本仓库把它当成问题本身——事实主张读者还能去查，观点读者查不了，而改写稿署的是作者的名字，读者无从分辨哪一句是作者的、哪一句是改写工具加的。还有一层是验收：ALL-PROT-019 要求改前列两份清单、改后逐项核对，第二份清单记的是主张、依据、例子、反例、条件、比较、因果和结论；新增一个观点会让这份清单对不上，而本仓库没有第二套办法核对新增的观点是不是作者会同意的。 作者那个场景成立时怎么开启：原文里已经有的反应、犹疑和复杂心情由 ALL-PROT-017 保住，本批新增的 ALL-G-006 又按体裁把这件事写死——那是不让它被删掉，不是替作者造一份。用户明确要求"写得更有个性"时，可选做法在 references/optional.md（EN-S-002、ALL-S-002、ZH-M-002 三条都记 reference-only）；用那一份时上游本条的另一半（不得加事实主张）仍然有效，而且比它更严的 ALL-PROT-001 一直有效。本仓库没有留"改写时自行补出观点"的开关。上一批 op7418 的 ZH-S-001 是本条的中文翻版，按同样的理由记 rejected，中英两侧结论一致。按 criteria.md 第 1 条与第 8 条。
