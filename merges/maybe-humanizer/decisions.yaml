    rule_id: EN-P-059
    note: 本条管输入侧的标记，EN-PROT-001 管改写时不得新增表演式坦白；同一现象的两端。
  rationale: 上游把这一组的来由写得很清楚：他先在声口那一节要求「把声口放回去」，然后指出这条指令有一个可预测的失败方式——模型会伸手去拿一套现成的「人味」动作，装上一个作者从来没有的个性，"That trades one detectable register for a louder one."。他给的证据是对 blader/humanizer 的一次独立压力测试：通用的机器措辞被换成了一种可辨认的 humanizer 腔（碎片句加断续节奏），换来的是一个新指纹，不是没有指纹。这个测试结果是上游给的依据，本仓库没有核实过，按 ALL-M-024 不作为已验证事实转述。 本仓库采纳。四类里每一类在检测侧都已经有对应规则（生造利害对 EN-P-007、表演式坦白对 EN-P-007 与本批新立的 EN-P-059、破折号对 EN-P-026、碎片句对 EN-P-025），但改写侧一条都没有——现有的 ALL-PROT-018 覆盖的是错别字、emoji、网络用语、第一人称、幽默、感受和个人经历七类，这四类一类都不在里面。上游的破折号那一条把缺口点得最准："The rule elsewhere is a rate ceiling; this is about *adding* dashes during a rewrite, which should never happen."——频率上限会被当成配额用，只要没超上限就可以随便加。英文批一的报告第 10 节已经记过这个缺口，本条把它补上。 「不因为模式命中清零而通过」这一句是本条的裁决规则，不是修辞：ALL-PROC-014 的交付前自查问的是「还剩哪些像 AI 写的」，问不出「这一遍新加进去的」；ALL-M-025 的保留性核对给的是发现它的办法，本条给的是发现之后的结论。 本条按 ALL-PROT-043 放在改写指令一侧，不进模式目录：同一处 Let's be honest，作者写的按 EN-P-007 判定、可以保留，改写工具加进去的按本条一律算失败，区别在于这句话是谁写的，任何模式判据都看不出来。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。 另按第 1 条：违反本条时改写稿里会出现原文没有的内容，属于 protection；并按 ALL-PROT-043 放在改写指令一侧，不进模式目录。
