    note: 中英各一套引号取值顺序，口径对齐：原文已经一致时那个一致就是作者的选择，兜底值只在没有任何信号时生效。
  - type: pairs-with
    rule_id: EN-PROC-002
    note: EN-P-044 给原稿混用时的取值顺序，本条规定这一步在什么时候做、对哪些内容做。
  rationale: 上游的判据是条件式的——命中条件不是"用了弯引号"，而是"用了弯引号而作者或目标格式用的是直引号"；他在 `### What not to flag` 里另外写明孤立的弯引号不算证据，因为 macOS、Word、Google Docs 和多数 CMS 默认会自动转弯。本批核对了 Wikipedia:Signs of AI writing 的 `Curly quotation marks and apostrophes` 一节，那里写得更细：模型会在同一段回复里成对地混用弯直引号，而弯引号本身在按 Chicago Manual of Style 排版的出版物里是常规。所以真正可判定的信号是混用，不是弯引号本身。 本仓库现有的 EN-P-037 只规定了原稿一致时怎么办，混用时它给不出答案，本条补的正是这一格。改的是上游的默认值：上游默认改成直引号，本仓库不预设某一种取值，改成按信号取值，理由与上一批的 ZH-P-025 一致——原文已经一致时那个一致就是作者的选择，兜底值只在没有任何信号时生效。按 criteria.md 第 1 条（不替作者定他没定的事）和第 2 条（混用可以数出来）。 【英文批二补记】本条的 rule_summary 本批改过，decision_revision 从 1 加到 2，decision 值不变。upstream-conorbronsdon-avoid-ai-writing 给了本条一条证据，多出三层判据：双引号族和单引号（撇号）族各自独立推断风格，不绑在一起处理；同一族里多数与少数打平时用第一次出现的那一种；某一族在原文里没有证据时那一族不动。 三层都并进了本条。第一层是实质补充——一篇稿子里双引号和撇号的来源常常不同（正文手打、引语粘贴），把两族绑在一起统一会改掉原文里真实存在的区分，而本条原来的写法（按原稿里占多数的一种）没有说这个「多数」是按哪一族算的。第二层给了打平时的确定答案，本条原来在这种情况下落到「三者都判断不了时不动」，那会让一份两种各占一半的稿子完全不处理。第三层与 ALL-PROT-017 同向：没有证据时不替作者做决定。 上游还给了一条本条不采纳的：明确的 house style 设定覆盖从原文推断的结果。本条已经把「用户在本轮请求里指定的」和「目标发布格式要求的」排在原稿多数之前，覆盖了这一条的实质，不重复写。 EN-P-037 的分域关系不变（原稿只用一种时按那条沿用），与 ZH-P-025 的 pairs-with 关系不变。
