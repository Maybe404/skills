  rationale: 上游的依据写在同一段里——"humans on autopilot — especially writing under deadline pressure, in unfamiliar genres, or in a second language — produce the same shapes"。他要防的是把一个统计上更常见于 LLM 输出的形状当成充分条件；他给的补救不是删规则，而是要求把语境作为第二个输入。上游为这个立场给了三份出处（Liang 等人 2023 对商用检测器的非母语假阳性率、Jabarian 与 Imas 2025 对开源检测器的误判率、arXiv:2506.07001 对抗性改写的效果）；这三份是上游给的依据，本仓库没有核实过，不作为已验证事实转述。 本仓库采纳，理由是它补的是现有规则的另一半。ALL-M-002 说的是「哪些痕迹单独出现不算证据」（按痕迹的种类分），本条说的是「同一批痕迹在什么作者和什么体裁下证据更弱」（按语境分）——ALL-M-002 挡不住一份技术文档同时命中五条形式规则的情形，本条挡得住。ALL-PROT-012 已经禁止对作者身份下结论，本条给的是在那条禁令之内怎么把命中说清楚。 可判定：审稿结论里要能指出这几条命中分别与哪一项语境相关（非母语、赶稿、技术体裁按设计压缩词汇），指不出来就说明没做这一步。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。
