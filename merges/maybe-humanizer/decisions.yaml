  relations:
  - type: conflicts-with
    rule_id: EN-P-026
    note: EN-P-026 按篇幅分界（200 词以下一处不用，200 词以上至多一到两处），本条是无条件禁令；取 EN-P-026。
  rationale: 上游三处陈述都不带频率或密度口径，确认是无条件禁令而不是上限。他把破折号归进 Rhythm 一类而不是标点或格式，说明他关注的不是排版而是破折号造成的停顿——他认为那是制造戏剧停顿最省力的手段；一刀切换来的是可判定性，与他删所有副词、禁所有被动是同一种取舍。 本仓库不采纳，取 EN-P-026。理由不是票数：无条件禁令会把作者原有的停顿改成句号，而作者的节奏按 ALL-PROT-017 属于作者，不得为了"统一"改掉；破折号在英文里有真实用法（插入语、话锋中断），删掉它们不丢事实但会改声口。上一批 ai-zixun 的 ZH-S-002（中文完全禁用长破折号）按同一条理由记 rejected，中英两侧结论一致。 还有一处可以写给作者看的事实：上游自己的 references/examples.md 的 Example 4 里，标为"正确改法"的 After 文本用了一处 em dash（"Speed, quality, cost—pick two."）。 他那个场景成立时怎么开启：项目要执行完全禁用的，按 ALL-PROC-025 用项目自己的 style guide 覆盖默认值；作者本人的写作样本不用破折号时，本批新增的 ALL-PROC-049 会让样本压过 EN-P-026 的默认口径，效果等同于本条。按 criteria.md 第 1 条与第 8 条。
