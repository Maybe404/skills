  rationale: 来源限定简体中文，本仓库改为中英文都适用——判据（原文有的限定语在改写稿里还在不在）不依赖语言，英文的 might、I think、not sure 同样适用，这是本条记 adopted-with-modification 的原因。independent_sources 为 1，但按 criteria.md 第 3 条五项逐项成立：本 skill 用到、现象真实、与已采用规则不矛盾、中英文都适配、evals 第二类样本直接覆盖。与 EN-P-030（与语气矛盾的保留语）冲突：EN-P-030 只能删与句子实际语气自相矛盾的保留语，不得删原文真实表达的不确定，两条的边界写在 conflicts.md。 【英文批一补记】hardikpandya/stop-slop 有一条 "No softeners, no intensifiers, no hedges."，判据看功能不看词形，因此会命中 most、to some extent 这类限定词——它自己唯一一处演示（references/examples.md 的 Example 2）删的正是 most。已单列为 EN-S-011 并记 rejected，双向记 conflicts-with：删掉 most 会把一个有范围的主张变成全称主张。这个来源四份文件里一条 protection 规则都没有，它的删改主张在没有保护条款兜底时是无上限的，本条就是本仓库给它补的边界。
