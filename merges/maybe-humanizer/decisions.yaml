  rationale: 这五类的共同点是它们的价值就在精确的写法：改一个字，命令跑不起来、报错搜不到、字段名对不上代码。上游把它们分成「按字面保护」和「按含义保护」两级，本条是前者。现有 ALL-PROT-008 已经收了引语、代码、公式、专有名词，但接口名、参数名、字段名、配置项、日志、报错这一组在中文技术写作里出现频率极高，而且字段名有一个特殊之处：它同时是标识符和普通词，模型看到 key、status、level 时很容易当普通词处理（这一点由 ZH-PROT-003 从另一侧兜住）。可判定：把改写稿里这五类内容逐个与原文做字符比对。
  history:
  - decision: adopted
    at: '2026-09-06T22:00:00Z'
    reason: 中文批合并
- id: ALL-PROT-033
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/protection.md
    anchor: '### ALL-PROT-033 技术文档的系统行为主语'
  category: protection
  language: both
  rule_summary: 技术文档里描述系统行为的主语（调度器、网关、任务、队列）要保留，不得为了「像人写的」换成人称主语或去掉：「调度器会在超时后重新入队」不得写成「我们会在超时后重新把它放回队列」。
  decision: adopted
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-06T22:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-mrgediao-shuorenhua
    path: SKILL.md
    commit: d2d0ce27da295581c3cf87a30ab65deb7d0ddfb8
    anchor: '- 技术文档里的系统行为主语'
  relations:
  - type: excepts
    rule_id: ALL-P-004
    note: ALL-P-004 禁止的是让抽象事物做只有人能做的动作（市场奖励、数据告诉我们）以及隐藏施事者的无主句；本条保护的是真实执行了该动作的系统主语。边界：这个主语在系统里是不是真的执行了这个动作——是，就属于本条，不属于 ALL-P-004 的判定范围。
  - type: conflicts-with
    rule_id: EN-S-006
    note: EN-S-006 要求每个句子都以人作主语，本条要求技术文档里的系统行为主语保留；取本条。
  rationale: 这是这份上游与通用去 AI 味规则冲突最明显的一处，而且它是对的：通用规则要求指名执行者、多用人称主语，但技术文档里动作的执行者就是系统。把系统主语换成人称不是风格改进，是事实错误——读者会以为这是人工操作。ALL-P-004 保持不变：它禁止的是拟人化（「市场奖励了那些先行者」）和隐藏施事者（「已完成配置」），本条保护的是真实的系统行为主语，两条按「这个主语是不是真的执行了这个动作」分域，不需要谁让位。可判定：问这个主语在系统里存不存在、它是不是这个动作的执行者。 【英文批一补记】hardikpandya/stop-slop 要求每个句子都有一个「人」作主语并在做一件事，与本条正面相反，已单列为 EN-S-006 并记 rejected，双向记 conflicts-with。上一批立本条时依据的是 shuorenhua 的技术写作场景；本批出现了一个明确主张相反口径的英文来源，本条的边界（这个主语在系统里存不存在、它是不是这个动作的执行者）在英文侧同样适用。上游自己的两份文件在这一点上口径不一致：SKILL.md 写 human subject，references/structures.md 写 subject，少了 human。
  history:
  - decision: adopted
    at: '2026-09-06T22:00:00Z'
    reason: 中文批合并
