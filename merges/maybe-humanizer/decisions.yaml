  language: en
  rule_summary: 除副词之外，软化语、强化语和保留语一律不留（"No softeners, no intensifiers, no hedges."）；判据是这个词在做软化、加强或保留的活，不看它是不是副词，因此 most、to some extent 这类限定词也在范围内。
  decision: rejected
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-hardikpandya-stop-slop
    path: references/phrases.md
    commit: 8da1f030185bdfe8471220585162991eaeb970e9
    anchor: '## Adverbs / No softeners, no intensifiers, no hedges.'
  relations:
  - type: conflicts-with
    rule_id: ALL-PROT-004
    note: ALL-PROT-004 要求原文表达的不确定必须保留，本条要求删掉全部保留语（含 most、to some extent）；取 ALL-PROT-004。
  rationale: 这一句与"删所有副词"同在一行，但判据不同：前半看词形，本条看功能，因此它能命中不是副词的词。上游四份文件里唯一一处演示在 references/examples.md 的 Example 2，那一组的 Changes 写的是 "Cut hedging ('most')"——被删的 most 是限定词。 这正是本仓库不能采纳的地方：把 "Most teams struggle with alignment" 删成 "Teams struggle with alignment"，一个有范围的主张变成了全称主张，撞 ALL-PROT-004（不得把原文表达的不确定说成确定）和 ALL-PROT-023（范围这一项必须逐项找得回来）。上游针对的现象成立——多轮编辑会一层层堆保留语，直到句子什么都没主张；本仓库处理这个现象的是 EN-P-029（不堆叠多层保留语，要么表态，要么只说出那一个真正不确定的点）和 EN-P-030（删掉与句子实际语气自相矛盾的保留语），两条都保留"原文真实表达的不确定不动"这个例外，本条不留。 这个来源四份文件通读两遍，一条 protection 规则都没有，它的删改主张在没有任何保护条款兜底的情况下是无上限的；本仓库按 criteria.md 第 1 条给它补边界，边界就在 ALL-PROT-004。 他那个场景成立时怎么开启：EN-P-029 已经允许把一串保留语压成一个。要连原文真实的限定一起删，本仓库没有留这个开关——那不是风格问题。
  history:
  - decision: rejected
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
