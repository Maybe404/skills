    rule_id: ALL-PROC-048
    note: ALL-PROC-048 规定怎么读样本，本条规定读出来的习惯与本 skill 的默认规则冲突时听谁的。
  - type: excepts
    rule_id: EN-P-026
    note: 作者样本给出了破折号的实际频率时按样本执行，EN-P-026 的按篇幅分界只在没有样本时生效。
  rationale: 上游把它写成一条明确的优先级（"A writing sample takes priority over these style rules."），并且指名了会被压过去的那一条（§14 破折号）。他防的是一个具体的失败：作者本人惯用破折号，而 skill 有一条全局禁令，不写这条优先级，这个 skill 会把作者的标点习惯当 AI 痕迹清掉。这正是 ALL-PROT-017 要挡的事，方向与本仓库一致。 采纳，加两处修改。一、明写"不优先于 protection 类规则"：上游没有这条限制，而 ALL-PROC-023 的裁决顺序里事实、原意、证据强度排在作者声口之前，样本再怎么优先也不能让改写稿丢事实或者放宽条件关系。二、把适用范围写成标点频率、用词正式度、句长偏好三项，不写成对全部风格规则的一揽子豁免；一揽子豁免意味着一份样本可以关掉本 skill 的任何一条规则，包括与保真有关的那些。这两处收窄按 criteria.md 第 1 条做。 本条也是本批处理破折号四方口径时唯一并进来的那一方，理由见 EN-P-026 的 rationale 补记。
