  rationale: 这类错误的特点是数字本身没被改，改的是它修饰谁——核对「数字有没有改」时完全查不出来，所以上游要求在动手前的账本里专门记一项「数字修饰的对象」。这是这份上游对数字保护最有价值的一条，现有 ALL-PROT-002 覆盖不到。可判定：把每个数字和它修饰的名词配成对，原文和改写稿的配对表不一致即违反。
