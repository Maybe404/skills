  rationale: 上游把问题命名为 "False authority"——全称词借来的是一种作者没有的权威；SKILL.md 的措辞（lazy extremes … doing vague work）补足了另一半：写作者用全称词是因为不想去查真实的范围。两处合起来是完整的理由。 现有规则里没有对应的：ALL-P-007 管的是抽象换具体，EN-P-039 管的是疑似捏造的统计数字，都不覆盖"全称量词当含糊用"这个判据。采纳，改的是修法：上游写的是 "Use specifics instead of sweeping claims."，直接照做会让执行者从原文之外补一个范围——上游自己的正例 "In the three incidents we reviewed" 里的"三次"就是反例里没有的，这一步撞 ALL-PROT-001 和 ALL-PROT-023。本仓库把修法改成两条：原文给了范围就换成那个范围，没给就删掉整条主张。按 criteria.md 第 1 条做的这处收窄；第 2 条成立——六个词可逐词匹配，"原文有没有给范围"能问出是或否。
