  rationale: 上游给出了四个可对齐的维度，把「模仿项目文风」变成可执行的事。它与 ALL-PROC-025 的分工清楚：ALL-PROC-025 管的是显式给出的词表和规则，本条管的是没有写成规则、只体现在既有文章里的习惯。这是一个真实的缺口——多数项目不会写 style guide，但它的文档读起来是一致的，而通用去 AI 味规则会把这种一致性改掉（项目一直是短句直述，改写按本 skill 偏好的长短交错改成书面语）。可判定：把项目样本和改写稿在这四个维度上各写一行，明显不一致即违反。 【英文批一补记】blader 的写作样本机制与本条按范围分域：本条管项目里已有的文风样本（既有文章、样例文档），新增的 ALL-PROC-048 管用户为这一次改写提供的作者本人旧作，并给了六个可观察的分析维度；两者同时存在时按 ALL-PROC-023 的裁决顺序，作者本人的样本在先。相关的优先级规则见 ALL-PROC-049。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条一条证据，口径几乎一致：作者给了自己写的样本时，分析这份样本的句长分布、缩写使用率、段落开头方式和反复出现的用词，按这些去改，而不是套一个有名字的声口档位。他单独写出了一句本条没有的禁令——不要「升级」他的词汇：他写 stuff 和 things，就保持这个语域。这一句防的是这条规则最容易出的错，照着样本改写的同时顺手把作者的用词改得更「好」。本条现有的正文写的是「不套用本 skill 偏好的节奏」，没有点到用词这一层；补进正文要改一条 human-approved 规则，记进第 10 节。 与 ALL-PROC-048 的分工不变：那条是有样本时先按六个维度记下来，本条是按记下来的维度改写。有样本时本条优先于 EN-S-001 的五档，这一点上游写得很明确（"rather than a named profile"）。
