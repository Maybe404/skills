- id: ALL-PROC-048
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/process.md
    anchor: '### ALL-PROC-048 先分析用户提供的写作样本'
  category: process
  language: both
  rule_summary: 用户提供了作者本人以前写的文字作为写作样本时，动手改之前先把这份样本按六个可观察的维度记下来：平均句长与句长变化、用词偏好、段落开头的方式、标点习惯、反复出现的短语、段与段之间的过渡方式。没有样本时本条不适用，按通用规则改。
  decision: adopted
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-blader-humanizer
    path: SKILL.md
    commit: e2e92e7b4b8229253ed5c8e81dc65463fdeddda5
    anchor: '## Match the writer''s voice'
  relations:
  - type: excepts
    rule_id: ALL-PROC-037
    note: ALL-PROC-037 管项目里已有的文风样本（既有文章、样例文档），本条管用户为这一次改写提供的作者本人旧作；两者同时存在时按 ALL-PROC-023 的裁决顺序，作者本人的样本在先。
  - type: pairs-with
    rule_id: ALL-PROC-049
    note: 本条规定怎么读样本，ALL-PROC-049 规定读出来的习惯与本 skill 的默认规则冲突时听谁的。
  rationale: 上游没有直接说理由。他把"像人写的"操作化成了"像这个人写的"：没有样本时只能按通用规则改，有样本就有了一个具体目标，而且这个目标可以从六个能数、能对照的特征上读出来——推断依据是他列的六项全是可观察量，没有一项是"语感"这类描述。 本仓库采纳。适用性上它补的是一个真实的缺口：ALL-PROT-017 已经规定作者的词汇、节奏、直率程度、犹疑和跑题不得改掉，但没有规定"怎么知道这个作者的习惯是什么"；没有这一步，保护作者声口只能靠执行者对原文的印象，而原文本身可能已经被前几轮改写洗过。按 criteria.md 第 2 条可判定：问"这六项记下来了吗"能得到是或否；第 3 条的五件事都成立。与 ALL-PROC-037 的范围边界见 relations。
  history:
