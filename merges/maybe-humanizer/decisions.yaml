  rationale: 上游加了两重条件（Where appropriate、If the piece is supposed to have a voice），意图是不让这条变成往任何文本里塞第一人称的许可；同一份文件的改写者禁令一节又把边界写死——原文没有 I，改写稿就没有 I。所以他的主张不是「补上第一人称」，是「把缺席记成一个信号」。他针对的现象成立：模型一贯中立，而一篇个人随笔通篇没有作者在场确实反常。 记 reference-only，按 criteria.md 第 4 条。它是单一来源的强风格意见，要求的是一种具体的人称偏好，而判定的前提「这篇本来该有声口」需要知道作者想写成什么样——换一个作者、换一个体裁就不成立。本仓库的 EN-S-002 和 ALL-S-002 在首次合并时按同一条理由记 reference-only，本条与它们同组。 与 ALL-PROT-018 的关系：那条禁止添加原文没有的第一人称。本条与它表面冲突、实际不冲突——本条说的是「缺席是一种信号」，不是「改写时补上」，上游用改写者禁令那一节把这个边界写死了。这个限定机制值得记下来：一条要求某种腔调的规则，只要它的落地方式被限定成「标记而不是补写」，它与保护条款就可以并存。本批据此把 EN-S-001 从 reference-only 改判为可选项，理由同源；本条没有一起改判，因为它给的是一个检测信号而不是一套可核对的改写目标——EN-S-001 的五档各自有句长、缩写率这类可以核的值，本条只有「该有而没有」。 怎么开启：用户明确要求「看看这篇是不是缺了作者在场」时按本条给出观察，做法写进 references/optional.md；开的时候 ALL-PROT-018 依然有效，观察只进报告，不进改写稿。
