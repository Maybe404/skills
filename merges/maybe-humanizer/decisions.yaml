  rationale: 上游写了这个形状的来历——"that's the shape LLMs default to when asked to summarize features"，并给了真人列表的反向特征：长度参差、偶尔带动词、总有一项不合群。他强调真正的判据是对称性而不是项数：五项裸短语只要长度和语法形状完全一致、没有一项作出可核对的断言，就是这个形状。 本仓库现有的 ALL-P-002 说的是「不把本可以两三句说清的内容拆成加粗项目符号列表」，没有可数判据，也没有体裁例外，因此判定时要靠「本可以两三句说清」这个需要判断的前提。本条给同一现象补上了两样 ALL-P-002 没有的东西：一个可数的门槛（五项、六词、无限定动词），和一份体裁例外清单。 改的地方有一处：上游的例外清单里没有「功能清单」，但他自己在说明这个形状的来历时正是拿功能摘要举的例（asked to summarize features）——一份 README 的功能清单本来就该是裸名词短语。本仓库把它补进例外，并按 ALL-G-002 和 ZH-G-003 的口径，例外的判定依据是这段内容所在的体裁，不是它读起来整不整齐。 与 ALL-P-002 的分工：那条判这部分内容该不该用列表这个形式，本条判一份已经成立的列表里各项写成了什么形状。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。 另按第 2 条：上游给了可数的门槛（五项、六词、无限定动词、语法形状相同），能对着一份列表逐项圈出违反在哪里。
