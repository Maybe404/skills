  rationale: 四个来源里有三个独立谱系提出同一条红线，且它是 criteria.md 第 1 条的直接体现：违反时输出里会出现原文没有的事实。可判定——拿改写稿逐项比对原文的事实清单，多出来的即违反。与 ALL-S-002（逼出鲜明立场）冲突：那条要求补一个原文没有的判断，因此那条记 reference-only。 【中文批补记】ZH-S-001（改写时补出作者反应和立场）与本条冲突，取本条，ZH-S-001 记 rejected。另有一处反例证据：upstream-op7418-humanizer-zh 的正文没有任何一句允许补写事实，但它六组「改写后」示例都补了原文没有的内容（补出机构名与年份、补出开业时间、补出注册文件年份、补出扩张计划），同时它没有译出对照件里「原文给了来源就点名，否则删掉这条没有支撑的论断，绝不编造来源」这三句，也没有译出改写流程里的事实增删自检。示例在 skill 里是被模仿的对象，效果等同于规则，因此这组示例记为本条的反例证据，不另立规则。 【英文批一补记】blader/humanizer 在 `## What to do` 第 3 条里给了一条例外——作者的声口需要时可以加一个观点或一句反应，只是不许加事实主张。这条与本条的禁止清单正面相反（本条把「观点」与「事实」并列禁止），已单列为 ALL-PROT-035 并记 rejected，双向记 conflicts-with。裁决理由写在 ALL-PROT-035 的 rationale 里：观点署在作者名下而读者无从分辨，且 ALL-PROT-019 的第二份清单没有办法核对新增的观点。references/optional.md 里的 EN-S-002 和 ALL-S-002 仍保持 reference-only，用户明确要求时才开；开的时候本条依然有效。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 从改写侧给了本条两条证据。一是「不得生造逆反立场」（Everyone says X, but they're wrong、the conventional wisdom is backwards），他的判据写得比本条更锋利："Inventing a foil is inventing a claim."——造一个靶子不是修辞问题，是事实问题，因为「大家都这么说」本身是一个可以为真为假的断言。二是「不得添加原文没有的具体信息」（数字、名字、日期、工具、机制），他写明了这一条为什么最危险："Specificity is the most tempting fix because it always reads better, and a fabricated specific is worse than the vague phrasing it replaced."——具体化会让文字变好，所以执行者知道编一个是有回报的。这两条的检测侧对应本批分别立成 EN-P-078（靠想象中落后的人群撑主张）和 EN-P-062（对仗式对比里一半是现造的），本条仍然只管改写侧。 【全局复核补记】本条与 ALL-PROC-026（生成若干互不相同的开头候选）的 conflicts-with 此前只在 ALL-PROC-026 一侧点名。补在这里：那条要求造出原文没有的具体场景当开头，本条禁止新增原文没有的事实和例子，两条同时命中时按 criteria.md 第 1 条取本条，ALL-PROC-026 记 reference-only。
  history:
