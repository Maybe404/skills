  rationale: 上游写的是 "It also adds clipped endings such as 'no guessing' instead of writing a clear clause."。他盯的是省略本身：这个位置本该有一个说明为什么、怎么样的从句，截断之后句子显得干脆，代价是意思要读者自己补。 拆规则时这一条的 Wikipedia 归属存疑。本批直接核对了 Wikipedia:Signs of AI writing 的 `Negative parallelisms` 一节：它只有三个变体——`Not just X, but also Y`、`Not X, but Y`（含 `no ..., no ..., just ...` 这一种）、`X rather than Y`，三个都要求否定后面跟一个正面的说法，没有一个是"只剩否定、没有 Y"的截尾。所以本条是 blader 作者自己补的，与 upstream-aboudjem-humanizer-skill 不同源，两者在这一点上构成两个独立观察（但本条目前只有 blader 一个来源）。 现有的 EN-P-006 四个例子全是句首或整句的否定对比，管不到句尾截断，本条补的是这一半。按 criteria.md 第 2 条（能圈出句尾那个逗号加否定短语）和第 3 条采用。
