    note: ALL-P-001 给句长与段落结构的判定口径，本条给交付时的验收要求：清完词表还得能指出结构上动了哪一处。
  - type: pairs-with
    rule_id: ALL-PROC-014
    note: ALL-PROC-014 的交付前自查含「句长和段落结构是否有变化」，本条把这一项定成不通过就退回的硬项。
  - type: pairs-with
