- id: EN-P-054
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/conflicts.md
    anchor: '### EN-P-054 X that isn''t Y 靠否定下定义'
  category: pattern
  language: en
  rule_summary: 不用 "X that isn't Y" 这种靠否定给事物下定义的说法，直接给出正面陈述（改写成 "X is broken"）。
  decision: rejected
  decision_origin: model-proposed
  decision_revision: 1
  decided_at: '2026-09-07T12:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-hardikpandya-stop-slop
    path: references/structures.md
    commit: 8da1f030185bdfe8471220585162991eaeb970e9
    anchor: '## Formulaic Constructions / | "X that isn''t Y" | Indirect. Say "X is broken" |'
  relations:
  - type: conflicts-with
    rule_id: ALL-PROT-023
    note: ALL-PROT-023 要求原文的强度这一项在改写稿里逐项找得回来，不得放宽；本条给的修法把「没有在重试」换成更强也更宽的「坏了」。取 ALL-PROT-023。
  rationale: 上游给了问题命名 "Indirect" 和一个替换示范（Say "X is broken"）：他反对的是用否定绕开正面判断——写的人知道这东西不工作，却写成"一个不工作的 X"，把判断藏进定语。这个观察本身有道理。 本仓库不采纳，问题出在他给的修法。`a retry loop that isn't actually retrying` 说的是"没有在重试"，`the retry loop is broken` 说的是"坏了"：后者是一个更强也更宽的主张——没在重试可能是配置关掉了、可能是上游没有触发，不一定是坏了。ALL-PROT-023 明写强度这一项不得放宽，照这个修法改就是改事实。 判据本身也圈不准：`X that isn't Y` 是英文常规的限制性定语从句，"a config that isn't versioned"、"a queue that isn't drained" 这类正常句子同样命中，按 criteria.md 第 2 条圈不出违反在哪。EN-P-006 管的是"先否定一个说法再给出另一个"的双句式，判据不同，不受本条影响。 他那个场景成立时怎么开启：把判断藏进定语、而正面说法更短也更清楚的情形，由 ALL-P-007（能给具体内容的地方给具体内容）处理。本仓库不把这个句型本身列成禁用骨架。
  history:
  - decision: rejected
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
