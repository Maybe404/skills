    note: ALL-PROC-018 管改写时不得硬注入个性，本条管输入文本里已经有这套道具时怎么判。
  rationale: 上游写明了它为什么难清——"A post can clear every vocabulary tier and still be wearing this costume"：这套道具与真实的随意声口最接近，因此最容易在清理之后活下来。他还说明哪几类做成了确定性匹配（六个星号舞台指示、四个括号插注的完整网格）、哪几类留给判断（判决式收尾、标签式开场、自问自答、because of course it does），理由是它们与普通抱怨同形。 本仓库采纳。ALL-PROC-018 里有一句「给本该平实的文字硬注入个性同样算 AI 味」，ALL-PROT-018 禁止添加原文没有的网络用语和 emoji——两条都是改写侧的约束，管不到输入文本里已经有这套道具的情形。本条是检测侧的对应，六类道具本身现有规则里一条都没有。 改的地方有一处：上游的例外写的是「某个作者本来的声口就建立在这些道具上」，判定依据留给执行者；本仓库把它接到 ALL-PROT-017（作者本人的词汇、节奏、幽默属于作者）和 ALL-PROC-048（有作者写作样本时先按六个维度记下来）——有样本时按样本判，没有样本时按同一份文本里这套道具是不是通篇一致地出现判，两者都不成立时按本条处理。 六类共用同一条判定逻辑（戏外包给道具），因此合为一条规则而不是六条。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。
