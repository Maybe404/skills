  rationale: 上游把这一步写成一个固定的机械步骤而不是一条写作规则，理由从他的做法能读出来：改写必然把弯引号和直引号混进同一篇（模型输出倾向弯引号，原文可能是直引号），这是改写引入的副作用而不是原文的问题，所以处理它的办法是在流程里加一步，不是在模式表里加一条。他要求以原文为参照而不是以某种「正确」风格为参照，这一点与 EN-P-037 的口径完全一致。 本仓库采纳这个步骤，改了它的执行方式：上游跑一个脚本（`node scripts/normalize-quotes.js`），本仓库不跑脚本，改成人工按同一套约定处理；上游还写了脚本跑不起来时要手工处理并声明这一遍未经机械校验，本仓库没有机械校验这一档，因此不需要那句声明——但「留一份原文副本」这一条照收，因为没有副本就没有参照，EN-P-037 的「跟随作者原稿」在改写之后无从执行。 这条填的缺口：EN-P-037 和 EN-P-044 都是判定规则（原稿用哪种就保持哪种、混用时按什么顺序取一种），两条都预设执行者手上有原稿的引号分布，而改写完之后原稿已经被覆盖掉了。现有规则里没有一条要求留副本。 与 EN-PROC-001 的分工：那条是交付前对四种破折号字形做字面搜索，本条是改写后对引号做规范化；两条都是英文侧的机械步骤，执行顺序是先本条再那条（那条要在终稿上再执行一次）。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。
