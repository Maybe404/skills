  relations:
  - type: conflicts-with
    rule_id: ALL-PROC-027
    note: ALL-PROC-027 的“去掉所有保留语”会把原文真实表达的不确定删成确定；按 criteria.md 第 1 条取本条，ALL-PROC-027 在全局复核里从 duplicate 改判 rejected。
  - type: conflicts-with
    rule_id: EN-P-030
    note: EN-P-030 删保留语，本条要求原文真实的不确定不得删成确定；EN-P-030 的触发条件已收紧成“同一句里保留语与绝对化表述并存”，分不清的归本条。
  - type: pairs-with
    rule_id: EN-P-030
    note: 两条一起划出保留语的边界：真实的犹疑保留，与绝对化表述并存的那一种删。
  - type: conflicts-with
    rule_id: EN-S-011
    note: EN-S-011 要求删掉全部软化语和保留语（含 most、to some extent），本条要求原文表达的不确定必须保留；取本条。
  - type: conflicts-with
    rule_id: EN-P-065
    note: ALL-PROT-004 要求原文表达的不确定必须保留，本条要求无条件删掉 perhaps、could potentially；取 ALL-PROT-004。
  - type: pairs-with
    rule_id: EN-P-029
    note: EN-P-029 压掉堆叠的多层保留语，本条保住其中真实表达不确定的那一个；先按 EN-P-029 判是不是堆叠，再按本条判剩下的那一个能不能删。
  rationale: 来源限定简体中文，本仓库改为中英文都适用——判据（原文有的限定语在改写稿里还在不在）不依赖语言，英文的 might、I think、not sure 同样适用，这是本条记 adopted-with-modification 的原因。independent_sources 为 1，但按 criteria.md 第 3 条五项逐项成立：本 skill 用到、现象真实、与已采用规则不矛盾、中英文都适配、evals 第二类样本直接覆盖。与 EN-P-030（与语气矛盾的保留语）冲突：EN-P-030 只能删与句子实际语气自相矛盾的保留语，不得删原文真实表达的不确定，两条的边界写在 conflicts.md。 【英文批一补记】hardikpandya/stop-slop 有一条 "No softeners, no intensifiers, no hedges."，判据看功能不看词形，因此会命中 most、to some extent 这类限定词——它自己唯一一处演示（references/examples.md 的 Example 2）删的正是 most。已单列为 EN-S-011 并记 rejected，双向记 conflicts-with：删掉 most 会把一个有范围的主张变成全称主张。这个来源四份文件里一条 protection 规则都没有，它的删改主张在没有保护条款兜底时是无上限的，本条就是本仓库给它补的边界。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 在两处与本条冲突，本批都取本条。一是一张无条件删除保留语的词表（perhaps、could potentially、it's important to note that、to be clear），本批立成 EN-P-065 记 rejected，双向记 conflicts-with；分歧在这张表里混了两类东西——后两条是套话（删掉不改变命题），前两条是真保留语（删掉把有条件的主张变成确定的主张）。二是 blunt 声口档要求「几乎不用保留语」，本批把它并进改判后的 EN-S-001，并在那条上记了一条 excepts 指向本条：blunt 一档的这条目标遇到原文真实表达的不确定时让位给本条，「几乎不用保留语」在本仓库读作「不堆叠保留语」（EN-P-029），不读作「删掉全部保留语」。 值得记下的一处：同一份上游文件的另一节（情态词与保留副词叠用）写的是 "Either word alone is acceptable; the stack is the tell."——单独用哪一个都正当，叠起来才是痕迹，那一条与本条完全不冲突，本批已并进 EN-P-029。同一份来源在同一批词上给了两种强度，本批取他写得更细的那一条。 本条的 decision 与 decision_revision 不变。 【全局复核补记】本条与 ALL-PROC-027（设一个更激进的档位：句子更短、态度更鲜明、去掉所有保留语）的 conflicts-with 此前只在 ALL-PROC-027 一侧点名。补在这里：那条的「去掉所有保留语」会把原文表达的不确定说成确定，与本条正面相反；本次全局复核已把 ALL-PROC-027 从 duplicate 改判为 rejected，理由与 ALL-PROC-041 一致。
  history:
  - decision: adopted-with-modification
    at: '2026-09-06T12:00:00Z'
    reason: 首次合并
