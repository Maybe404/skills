  rationale: 上游把这类句子叫 narrator 腔，特征是文本在叙述之外还要说明这段叙述的意义。它被单列进 Pass 2 的残留检查，理由是它常常以「补充说明」的面目留在稿子里，第一轮不会被当成套话删掉。EN-P-022 已经管英文，中文侧没有对应规则。可判定：这半句删掉之后，前面那件事有没有变得不清楚——没有，就是旁白。与 ZH-P-015 的边界：ZH-P-015 管把事实抬到时代高度，本条管替读者总结这件事的含义，两者可以同时命中同一句。
