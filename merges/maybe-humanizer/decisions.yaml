- id: EN-P-039
  local:
    skill: maybe-humanizer
    path: skills/maybe-humanizer/references/patterns-en.md
    anchor: '### EN-P-039 疑似捏造的痕迹'
  category: pattern
  language: en
  rule_summary: 疑似捏造的痕迹要标出来交给作者确认：精确到小数位却无法核实的统计数字、归到查不到的来源的引用、对冷门事实的自信断言且没有出处。不自行删除，也不自行改写。
  decision: adopted-with-modification
  decision_origin: human-approved
  decision_revision: 1
  decided_at: '2026-09-06T12:00:00Z'
  evidence_count: 1
  independent_sources: 1
  sources:
  - type: upstream
    source_id: upstream-aboudjem-humanizer-skill
    path: skills/humanizer/SKILL.md
    commit: 275af9489079d0c4a95d47d62a311a5cb0bd85ba
    anchor: '### FILLER & HEDGING PATTERNS / P25: Hallucination Markers'
  relations:
  - type: pairs-with
    rule_id: ALL-PROT-014
    note: 疑似捏造的痕迹与不得静默纠正走同一个出口：写进“需作者确认”，不自行删改。
  - type: pairs-with
    rule_id: EN-P-062
    note: 生造的那一半是一个没有出处的术语主张，按 EN-P-039 标出来交作者确认，不自行替换成另一个术语。
  - type: pairs-with
    rule_id: EN-P-073
    note: 现造术语被当成既有概念引用时属于疑似捏造，按 EN-P-039 标出来交作者确认。
  rationale: 来源的处理动作是“核实或删除”，本仓库改成“标出来交给作者确认”，因为核实要走外部检索，撞上 ALL-PROT-015（默认不做外部核验）；删除会丢掉原文的事实，撞上 ALL-PROT-003（不默认压缩内容）。被否掉的是上游的处理动作，本条改写成「标出来交作者确认」之后与那两条不再相抵，按 process.md「历史原因不进 relations」不记 relation。这是记 adopted-with-modification 的原因。改写后与 ALL-PROT-014 走同一个出口：写进“需作者确认”。 【英文批二补记】本批裁决了本条与 EN-P-045 的处理动作分歧，那是英文批一留下的一处未裁决的重叠：本条要求疑似捏造的痕迹标出来交作者确认、不自行删除也不自行改写，EN-P-045 要求写明原文没有这项信息或整段略去、不得把猜测保留在正文里。upstream-conorbronsdon-avoid-ai-writing 在本批给了 EN-P-045 一条同向的证据（删掉这段猜测，或换成一条有出处的事实），把这个分歧变成必须裁决的。 裁决是两条按对象分域，不按处理动作取舍。本条管的是看起来像真的、无法核实的东西：精确到小数位却无法核实的统计数字、归到查不到的来源的引用、对冷门事实的自信断言。那些可能是真的——它们没有任何形式标记说明作者没有依据，删掉会丢掉一条也许成立的信息，所以处理动作只能是标出来交作者。EN-P-045 管的是自带保留语、形式上就是填空的猜测：likely began、appears to have studied、is believed to have、maintains a low profile。那些的形式本身就说明作者没有依据（保留语正是那个信号），把它留在正文里读者分不清哪一句有依据、哪一句是填的，所以处理动作是删掉或换成有出处的事实。 分域已在 EN-P-045 的 relations 里记成 excepts（单向），本条不改结论、不改正文。 判定顺序：先看这句话有没有保留语式的填空标记，有就按 EN-P-045，没有就按本条。
  history:
  - decision: adopted-with-modification
    at: '2026-09-06T12:00:00Z'
    reason: 首次合并
