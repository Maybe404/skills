  rationale: 上游给这类句子起了一个准确的名字：姿态层——它们不传达内容，只表演理解和接纳。这是中文对话模型近年最显眼的一类口癖，EN-P-028 的谄媚条目（Great question!）只覆盖了其中最浅的一层，「替对方下心理判断」和「身份认证式夸奖」在现有规则里完全没有对应，是本来源的显著增量。判据是上游给的「有没有在表演共情」，落地成可判定的形式就是：删掉这句之后，回应里还剩不剩下一个具体的判断或事实；不剩，这句就是纯姿态。与 ALL-PROT-012 方向一致：都拒绝据文本对人下结论。
