    note: ALL-M-005 拒绝的是给文本算一个 AI 概率分并按分段给判语（其中最低一档写明「不该被任何检测器标记」）；本条的五个维度都是写作质量维度，不声称能预测任何检测器的判定，两者不是同一类东西，边界就在分数指向的是检测结果还是写作质量。
  - type: excepts
    rule_id: ALL-M-004
    note: ALL-M-004 规定自己改完自己判分不算验收；本条只作自查信号，验收仍由独立的一遍检查或人来完成，两者按用途分域。
