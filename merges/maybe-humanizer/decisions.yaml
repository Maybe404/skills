    commit: 801c2360f360e38d4316a271b953138e5e166d54
    anchor: '### Infomercial engagement hooks / - The same move in a fake-candid register:'
  rationale: 两个独立来源，五条证据，是英文侧共识最强的模式。来源把它拆成四条（throat-clearing、comprehensive overview、collaborative leaking、hedged enumeration），判据都是同一条：这句话删掉之后，正文第一句还在不在。合成一条。例外（个人化插叙保留）来自 no-ai-slop，与 ALL-PROT-017 同向。 【英文批一补记】本批给本条补了四条证据（blader §28 announcing the next point、§33 fake-candid openings，stop-slop 的 throat-clearing openers 十五条词表与 `Look,` 一条）。blader 在 §28 里给了一条本条原来没有写出来的判据：要删的是「预告」这个动作，不是它的正式腔——把 "Let's dive in" 改成 "one thing that bit me hard" 看起来去掉了 AI 腔，实际上预告还在，只是换了语域。stop-slop 的词表多出 It turns out、The real [X] is、I'll say it again:、Can we talk about、Here's the problem though 五条，`Look,` 一条则被 blader 和 stop-slop 两个不同谱系同时点名。另外，stop-slop 主张删掉 "By the time X, I was Y." 这个叙事模板，与本条「能带出语境、张力或人物的个人化插叙保留」相反，已单列为 EN-P-053 并记 rejected，双向记 conflicts-with。补词表和补判据都要改本条的正文，本批不做，留给全局复核。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条四条证据，四条都在给「清嗓子式开场」补形式判据。一是 let's + 动词当过渡用的假协作式开场（Let's explore、Let's take a look、Let's break this down、Let's examine），他给了一条比词表更宽的兜底判据：这个 let's 在做过渡还是真的在邀请对方一起做一件事，做过渡的一律算——本条现有的词表里有 let's dive in，但没有这条兜底。二是先铺一段宽泛背景再进入正题（In the rapidly evolving world of…），他的判据是顺序而不是那句特定的套话，修法把背景本身留下了（Context can come second），说明他反对的是顺序不是内容。三是假想场景开场（Imagine a world where…、Picture a future in which…），判据是场景在替代论证做说服工作、没有给出任何证据；三条例外：虚构作品、写明了收益的思想实验、教学用的 imagine you have a sorted array。四是假坦率的停顿式开场（Honestly?、Look,、Real talk:、Let's be honest —）作为独立开场摆在一个普通论点之前，他把命中条件写在位置和功能上——这几个词出现在随意语体的句子中间是普通英语，不标记。 四条里的兜底判据、顺序判据、三条例外和位置判据本条现在都没有，补进正文要改一条 human-approved 规则，记进第 10 节。第四条上游自述改编自 blader/humanizer P33。 与本批新立的 EN-P-059 的分工按上游写的：那条是宣告自己要坦白的一整层框，第四条是一个词的停顿式开场。
  history:
  - decision: adopted
