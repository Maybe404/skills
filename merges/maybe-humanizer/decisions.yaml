  rationale: 落在 criteria.md 第 5 条第 1 款：来源的评分表把最低分档定义为“读起来像具体的人写的，不该被任何检测器标记（should not be flagged by any detector）”，即把绕过检测器写成了达标条件。此外公式的三项权重没有任何校准依据，两套严重程度量表（0-100 分数与“命中 8 条以上记 HIGH”）在同一来源内部就互不一致，且分数会被当成结论使用，与 ALL-PROT-012（不做作者身份鉴定）冲突。docs/design.md 第 9 节对 F 类的处理也是“做成自查清单，不做打分器”。替代做法见 ALL-PROC-014 的自查清单。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 提出了一种与本条被拒绝的做法形状相近、实质不同的机制：模式按三档排优先级（可信度杀手立刻改、明显的 AI 味发表前改、风格打磨有时间再改），快速过一遍时只做前两档，完整审计覆盖三档。 本条拒绝的是「按公式给文本算一个 0-100 分并按分段给出判语，以及按命中模式条数分严重等级、在输出首行打印分数」。他那套不打分、不算总分、不按条数分级，排的是同一批命中的处理顺序，因此本条的拒绝理由（分数会被当成结论、最低一档的判语声称不会被检测器标记）不适用于它。本批据此立 ALL-M-022，采纳按类型排优先级这个做法，同时去掉了他那套带判语的档位名（可信度杀手一类），理由是本条拒绝的核心正是判语——ALL-PROT-012 禁止据命中评价作者，一套带判语的档位名会把那条禁令磨掉。本条的 decision 不变。
  history:
  - decision: rejected
    at: '2026-09-06T12:00:00Z'
    reason: 首次合并
