  relations:
  - type: excepts
    rule_id: ALL-PROT-018
    note: 边界：ALL-PROT-018 禁止改写时添加原文没有的第一人称，本条只把缺席记成一个观察写进报告，不进改写稿；两条不同时作用于同一份文本。
