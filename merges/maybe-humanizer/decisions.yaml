    anchor: '## Severity tiers'
  relations:
  - type: pairs-with
    rule_id: ALL-PROC-015
    note: 只处理了前两档时按 ALL-PROC-015 标为阶段稿并写明第三档没查。
  - type: excepts
    rule_id: ALL-PROC-010
    note: 边界按维度分：ALL-PROC-010 禁止的是按体裁整组跳过检查，任何档位下四组都要过；本条允许的是文本很长或时间不够时按档位顺序处理，并且必须按 ALL-PROC-015 写明第三档本轮没查。体裁维度不得跳过，资源维度可以按序处理但要声明。
  rationale: 上游写的是 "Not all AI-isms are equal. When doing a quick pass or triaging a large document, prioritize by tier."，三档命名为 P0（可信度杀手）、P1（明显的 AI 味）、P2（风格打磨）。他要防的是把一处过渡词和一处捏造的专家背书当成同等严重的命中，那会让一份报告失去指导作用。 本仓库采纳这个做法，改了两处。一、不用 P0/P1/P2 这套命名，因为「可信度杀手」是一句对读者反应的判语，而 ALL-PROT-012 禁止据命中评价作者，一套带判语的档位名会把这条禁令磨掉。改成按命中的类型分档，档名是描述性的。二、第一档的内容按本仓库的 category 重排：上游 P0 里的五条（cutoff disclaimers、chatbot artifacts、vague attributions、significance inflation、hashtag stuffing）有四条落在本仓库的「生成过程残留和无出处断言」这一类，第五条（话题标签堆砌）在本仓库是纯排版问题，移到第二档。 与 ALL-M-005 的关系：那条记 rejected，拒的是「按公式给文本算 0-100 分并按分段给判语，以及按命中条数分严重等级」。本条不打分、不算总分、不按条数分级，排的是处理顺序；两者不是同一件事，那条的拒绝理由不适用于本条。 与 ALL-PROC-010 的关系：那条要求每次改写把四组检查都过一遍，不得因为体裁整组跳过。本条排的是同一组检查内部的处理顺序，以及时间不够时先做哪一档——写明「第三档本轮没查」正是 ALL-PROC-015 要求的阶段稿声明，不是整组跳过。 裁决依据：criteria.md 第 3 条五件事逐项成立——本仓库的 skill 会用到这个场景；上游描述的现象与反例成立；与已 adopted 的规则不矛盾（关系已记进 relations）；规则限定的体裁与本 skill 的目标读者相符；evals 留到全局复核写完正文后重跑。independent_sources 为 1，票数没有参与这条裁决。 另按第 3 条第 3 项（冲突风险）：与 ALL-M-005 的拒绝理由不冲突，那条拒的是打分与按条数分级，本条排的是处理顺序。 【全局复核补记】本条与 ALL-PROC-010 原来记的是 pairs-with，本次改成单向 excepts，边界写在 relation 的 note 里：ALL-PROC-010 管的是体裁维度（不得因为体裁不同就整组跳过），本条管的是资源维度（长文或时间不够时按档位顺序处理，未处理的部分按 ALL-PROC-015 写明）。两条并存时先按 ALL-PROC-010 确认四组都在范围内，再按本条排顺序；不得用本条的第三档当成 ALL-PROC-010 的豁免。
