    note: ALL-PROT-001 禁止新增原文没有的内容，本条管它最容易被绕开的那个位置：删掉空总结之后段落塌下来，补一句听起来无害的话。
  rationale: 删掉空总结之后段落会「塌」，这时补一句是最自然的反应，而最容易补出来的正是另一句空话。上游给了三级处理（先从原文找、找不到就不补、宁可短），把「段落要有落点」这个审美需求明确排在保真之后。这条值得单独立，是因为它标出了 ALL-PROT-001 在执行中最具体的一个失守点——不是有意编造，是为了让段落读起来完整。可判定：新出现的那句话在原文里找不到对应即违反。
