    note: EN-S-001 的五档要求按一组可核对的目标改写（句长、缩写率、每段一个具体主张），本条要求保留作者原有的词汇与节奏；EN-S-001 本批改判为默认不启用的可选项，用户点名一种声口时才生效，且五档的目标一律受「原文没有就不加」这条边界约束。两条同时命中时按 ALL-PROC-023 的裁决顺序：作者真实的声口排在第三档，本 skill 的默认风格排在第四档，本条压过 EN-S-001；有作者写作样本时按 ALL-PROC-037 与 ALL-PROC-049 走样本，不套档位。
