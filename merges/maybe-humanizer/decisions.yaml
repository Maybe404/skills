    anchor: '### 14. Em and en dashes'
  relations:
  - type: conflicts-with
    rule_id: EN-P-026
    note: 本条是禁令加作者样本例外，EN-P-026 是按篇幅分界的密度上限；同一段文字两条给出的处置不同，取 EN-P-026。
  rationale: 上游没有解释为什么破折号是 AI 痕迹。他把这条放进 Style patterns 而不是内容类，说明他当它是排版层的信号；而他给它配了一个明确的例外（作者的写作样本用破折号时按样本频率保留），说明他知道破折号本身是正当标点，问题在模型的使用频率。他在 `### What not to flag` 里也写了"孤立的破折号不算证据，只有与套路化的推销节奏同时出现才算"——这一句与同一份文件里的禁令口径互相拉扯。 本批核对了 Wikipedia:Signs of AI writing 的 `Overuse of em dashes` 一节，那里的口径同样是频率而不是禁令（"LLM output uses them more often than nonprofessional human-written text of the same genre"），并且附了一条 2026 年 7 月的研究：当代模型里只有 Claude 用得比专业写作者多，ChatGPT 用得更少。 本仓库因此不采纳禁令那一半，密度口径仍按 EN-P-026。采纳的是例外那一半——作者写作样本的优先级，本批立成 ALL-PROC-049，并把它从破折号这一条推广到标点频率、用词正式度和句长偏好三项，因为上游给的理由（不能把作者本人的习惯当 AI 痕迹清掉）在这三项上同样成立。他那个场景成立时怎么开启：作者样本不用破折号时，ALL-PROC-049 会让样本压过 EN-P-026 的默认口径，效果与本条的禁令一致；项目层面要全面禁用的，按 ALL-PROC-025 用项目自己的 style guide 覆盖。按 criteria.md 第 8 条两条都留、互相点名。
  history:
  - decision: rejected
    at: '2026-09-07T12:00:00Z'
    reason: 英文批一合并
