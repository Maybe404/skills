  rationale: independent_sources 为 1（同一来源的原则版和词表版），采用。这条自带例外，且例外方向与 ALL-PROT-004、ALL-PROT-017 一致：表达真实不确定的 I think、maybe 要留。可判定：删掉这个词，句子的意思有没有变。词表照录自 `upstream-petergyang-no-ai-slop`（Often-empty adverbs，逐条同序），说明文字为重写。按 skills/skill-merge/references/license-policy.md 的 full-text 口径，触发词表本身是判定数据，改写会让规则失去可判定性，因此照录；周围的说明文字、正例反例和执行强度是重写的。 【英文批一补记】hardikpandya/stop-slop 的对应主张是删掉全部副词、不留任何例外，已单列为 EN-S-005 并记 rejected，双向记 conflicts-with：删掉 possibly、probably、roughly 这类承担命题限定的副词会撞 ALL-PROT-004 和 ALL-PROT-023。它的十五条词表与本条重合十条，多出 really、genuinely、deeply、interestingly 四条；这四条可以补进本条的词表，但那是改一条已 human-approved 规则的正文，本批不做，留给全局复核。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条四条证据，三条补词、一条补口径。一是空心强调词（genuine / genuinely、real、truly、quite frankly、to be honest、let's be clear、it's worth noting that），修法是「直接把事实说出来」。二是 actually 的专属处理：默认是删除而不是换词，因为替换会把一个空词换成另一个空词；保留条件写得很紧——它标记的是一处具体的更正或与预期的落差、且句子本身写出了那个落差。本条现有的正文对整批词写的是「不承担强调、不确定、对比或作者语感时删掉，承担时保留」，没有写「保留时怎么处理」，也没有写默认动作是删还是换；这一层是补上的。三是 deeply 的搭配限定：只有在意义类搭配里才计入密度计数（deeply integrated、deeply committed、deeply rooted），字面用法（deeply nested、cares deeply）永远不计入——这是把误伤控制写成可执行条件的又一例，判据是搭配而不是词本身。四是确信度校准词（It's worth noting that、Interestingly、Surprisingly、Importantly、Significantly、Notably、Certainly、Undoubtedly、Without a doubt）按密度判定，他给了两个具体阈值：两千词里一个 notably 没问题，五百词里三个就是强调堆叠。本条现有的正文含 importantly、crucially，没有密度口径。 四处都要改一条 human-approved 规则的正文，本批一处都没改，全部记进第 10 节的补词表与补口径清单。词表照录自 upstream-conorbronsdon-avoid-ai-writing，说明文字为重写。
