    note: 用户说只要终稿、或本 skill 被另一个流程当成内嵌步骤调用时，按 ALL-PROC-021 省略本条的清单。
  rationale: 上游默认返回三样：草稿、还剩哪些模式的简短清单、终稿；上游没有说明理由，从它的四步改写流程看，三样与第二步、第三步、第四步一一对应，等于把中间过程整个公开。 本仓库只收第二样。收它的理由：ALL-PROC-014 已经要求执行者在交付前问自己"这稿子哪里还像 AI 写的"并诚实列出两三点，但那份清单留在执行者手里，用户拿不到；而改写没改掉的东西正是用户最需要知道的——它决定了用户要不要自己再动手，也决定了这份稿子能不能直接发。 不收草稿的理由按 criteria.md 第 3 条第 1 项（适用性）：ALL-PROC-008 的改动说明已经承担了"为什么这么改"的交代，再给一版草稿等于让用户在两份稿子之间自己比对；而上一批否掉 ALL-PROC-046（默认只给正文）时，三个来源共同提出的合理意见正是"说明太长"（已按 ALL-PROC-038 收下六条上限），交付草稿会把这个问题放大一倍。
