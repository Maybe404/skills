  relations:
  - type: excepts
    rule_id: ZH-M-001
    note: 英文侧按词数分档，中文侧按 ZH-M-001 不套这套指标。
  - type: pairs-with
    rule_id: ALL-M-002
    note: 句长有变化是改写时的目标，句长一致本身不是 AI 的证据；两条方向相反但配套，缺一条会误伤。
  - type: pairs-with
    rule_id: ZH-M-005
    note: ALL-P-001 管句长和段落长度的雷同，ZH-M-005管小节和句式骨架的雷同，两条的判定对象是不同层级。
  - type: pairs-with
    rule_id: ZH-P-013
    note: ALL-P-001 管句长和段落开头的雷同，ZH-P-013管段落收尾的雷同，两条合起来覆盖一篇文字的节奏可预测性。
  - type: pairs-with
    rule_id: EN-P-048
    note: 本条管句长和段落开头，EN-P-048 管段落收尾。
  - type: pairs-with
    rule_id: ALL-M-026
    note: ALL-P-001 给句长与段落结构的判定口径，本条给交付时的验收要求：清完词表还得能指出结构上动了哪一处。
  rationale: 三个独立来源，五条证据。Aboudjem 给了两套互相对不上的数值（一处是短 3-8 词、中 12-20 词、长 25-40 词、不超过 3 句同长，另一处是句长方差大于 30%、不超过 2 句相似结构），本仓库只保留可以直接数的那个判据——连续三句以上长度相近即违反——并去掉按词数分档的英文口径，因为中文按字计不适用；这是记 adopted-with-modification 的原因。与 ALL-M-002 配套：句长一致本身不是 AI 的证据，只是改写时的目标。试验后修复补上了缺失的容差：原来的“长度相近”没有可数的口径，判定无从下手。英文侧补回 Aboudjem 的 Burstiness 数值（短 3-8 词、中 12-20 词、长 25-40 词，不超过连续三句同档），这是上游原有的口径，本次只是把它写回来；同来源另一处的“方差大于 30%、不超过 2 句相似结构”仍不采用，理由是方差要算才知道，手上核不了，且与 Burstiness 一节的句数上限对不上。中文侧按 ZH-M-001 不套词数分档，改用可数的字数口径（连续三句以上相差在 3 个字以内）。 【英文批二补记】upstream-conorbronsdon-avoid-ai-writing 给了本条四条证据，覆盖三个层次。段落层：一篇里要有一到两句的短段也要有长段，每段都是三到五句且大小相当即命中。句子层：多数句子落在 15 到 25 词就读着像机器，修法是把短句（3 到 8 词）与长句（20 词以上）混着用。句首层：三句以上连续用同一个词开头，或者连续几句套同一个句骨架，而这一串没有在做说服工作时命中——他明确承认有意的首语重复是正当的修辞手法，因此把这一条整条留作判断题，并写明代词开头的连排（He… He… He…）是普通叙述。另有一条改写侧的对应指令（句长长短混搭、句子片段可以用），他在改写者禁令里给了它的边界：变化句长要靠改写句子，不靠断句，那一侧本批立成 EN-PROT-001。 本条现有的英文数值口径是短句 3 到 8 词、中句 12 到 20 词、长句 25 到 40 词、连续三句以上落在同一档即命中，与上游的 15 到 25 词命中区间接近但边界不同；两套口径本批没有合并，理由是本条的分档是 human-approved 的结论，合并要改它的正文。这一项记进第 10 节的全局复核清单。 句首连排那一条的中文侧对应是 ZH-M-005（同一种句式骨架连续出现到能预判下一句形状时改掉其中一处），判据几乎相同。
  history:
