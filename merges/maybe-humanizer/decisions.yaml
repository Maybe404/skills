  rule_summary: 用户提供了作者写作样本时，样本在三项上优先于本 skill 的默认风格规则：标点频率（含 EN-P-026 的破折号密度口径）、用词正式度、句长偏好。样本每两百词用一处破折号，改写稿就保持这个频率，不按默认口径清掉。样本不优先于 protection 类规则，也不优先于 ALL-PROC-020 的披露要求；三项之外的规则不因为有样本而放松。
