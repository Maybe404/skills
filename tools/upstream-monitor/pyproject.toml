[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upstream-monitor"
version = "0.1.0"
description = "Maybe404/skills 仓库的上游监控与流转工具"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.18",
]

[project.scripts]
upstream-monitor = "upstream_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
upstream_monitor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
